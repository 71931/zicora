<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zicora Community · 字卡传讯的独立社区</title>
<meta name="description" content="Zicora Community —— 围绕 Zicora 字卡传讯建立的独立社区，资源分享、公开交流、问题反馈与创作者互相鼓励。">
<link rel="preconnect" href="https://miaoda.feishu.cn">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@300;400;500;600&family=Noto+Sans+SC:wght@300;400;500;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap">
<style>
/* ============================================================
   Zicora Community — Mobile-first / editorial ivory
   ============================================================ */
:root{
  --bg:#FFFDF9;
  --card:#FFFFFF;
  --chrome:rgba(255,252,246,.86);
  --ivory:#FBF7EF;
  --ivory-deep:#F6F1E5;
  --paper-2:#F8F3E8;
  --ink:#221F19;
  --ink-2:#4B453A;
  --muted:#867E6D;
  --muted-2:#A79E8D;
  --line:#F0E8D8;
  --line-2:#F5EFE3;
  --line-strong:#DFD4C0;
  --sage:#8B9B81;
  --sage-deep:#6B7B62;
  --sage-soft:#EEF2EA;
  --gold:#A8853F;
  --gold-deep:#8A6B2C;
  --gold-soft:#F6EEDD;
  --rose:#B08279;
  --serif:"Noto Serif SC","EB Garamond","Songti SC","STSong","SimSun",Georgia,serif;
  --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  --latin:"EB Garamond","Noto Serif SC",Georgia,serif;
  --r:16px;
  --r-sm:12px;
  --r-xs:9px;
  --sh:0 1px 2px rgba(70,60,40,.04);
  --sh-lg:0 20px 44px -34px rgba(60,50,34,.5);
  --bar:50px;
  --tab:52px;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:#F1ECDF;color:var(--ink);
  font-family:var(--sans);font-size:13.5px;line-height:1.68;font-weight:400;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
/* faint paper grain */
body::after{
  content:"";position:fixed;inset:0;z-index:60;pointer-events:none;opacity:.26;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3'/><feColorMatrix type='saturate' values='0'/></filter><rect width='180' height='180' filter='url(%23n)' opacity='.2'/></svg>");
}
::selection{background:var(--gold-soft);color:var(--gold-deep)}
::-webkit-scrollbar{width:0;height:0}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
button{font-family:inherit}
svg{width:15px;height:15px;flex:0 0 auto;vertical-align:-2px;fill:none;stroke:currentColor;stroke-width:1.45}
input,select,textarea{font-family:inherit}
input[type=checkbox],input[type=radio]{accent-color:var(--sage-deep);width:15px;height:15px}

/* ============ phone shell ============ */
.phone{
  position:relative;width:100%;max-width:430px;margin:0 auto;
  height:100vh;height:100dvh;background:var(--bg);
  display:flex;flex-direction:column;overflow:hidden;
}
.appbar{
  flex:0 0 auto;height:var(--bar);display:grid;grid-template-columns:52px 1fr 52px;
  align-items:center;padding:0 4px;position:relative;z-index:20;
  background:var(--chrome);backdrop-filter:blur(16px);border-bottom:1px solid var(--line-2);
}
.ab-btn{
  width:42px;height:42px;border:none;background:transparent;border-radius:50%;
  display:flex;align-items:center;justify-content:center;color:var(--ink);cursor:pointer;transition:.16s;
}
.ab-btn:active{background:var(--paper-2)}
.ab-btn svg{width:19px;height:19px;stroke-width:1.6}
.ab-center{text-align:center;line-height:1}
.ab-title{font-family:var(--latin);font-size:13px;letter-spacing:.3em;color:var(--ink);display:block}
.ab-sub{font-size:7px;letter-spacing:.34em;color:var(--muted-2);display:block;margin-top:4px}
.ab-title-cn{font-family:var(--serif);font-size:14px;letter-spacing:.1em;color:var(--ink-2)}

#view{
  flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;
  padding:16px 16px 22px;animation:fade .3s ease both;
}
#view.chat-mode{padding:0;overflow:hidden;display:flex;flex-direction:column;animation:none}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.tabbar{
  flex:0 0 auto;height:calc(var(--tab) + env(safe-area-inset-bottom,0px));
  padding-bottom:env(safe-area-inset-bottom,0px);
  display:grid;grid-template-columns:repeat(5,1fr);align-items:center;
  background:var(--chrome);backdrop-filter:blur(16px);border-top:1px solid var(--line-2);
  position:relative;z-index:20;
}
/* 生成说明：常驻底部一行，不压内容、不挡操作 */
.aigc-note{
  flex:0 0 auto;padding:5px 14px 7px;text-align:center;
  font-family:var(--sans);font-size:9px;letter-spacing:.05em;line-height:1.4;
  color:var(--muted-2);opacity:.72;background:var(--bg);
  border-top:1px solid rgba(0,0,0,.04);user-select:none;
}
.tab{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  height:100%;border:none;background:transparent;color:var(--muted-2);
  font-size:9px;letter-spacing:.1em;cursor:pointer;transition:.16s;padding:0;
}
.tab svg{width:19px;height:19px;stroke-width:1.45}
.tab.on{color:var(--ink)}
.tab.on svg{stroke-width:1.75;color:var(--sage-deep)}
.tab .tab-av{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:10px;color:#5C5647;border:1px solid var(--line-strong);background:var(--paper-2)}
.tab .tab-av.on{border-color:var(--sage);box-shadow:0 0 0 2px var(--sage-soft)}

@media (min-width:520px){
  body{padding:24px 0;background:#F1ECDF}
  .phone{
    height:min(890px,calc(100vh - 48px));min-height:0;border-radius:42px;
    box-shadow:0 60px 120px -60px rgba(50,42,28,.5),0 0 0 1px #E4DAC6,0 0 0 10px #FFFDF7;
  }
}

/* ============ typography ============ */
.eyebrow{font-size:9px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);font-weight:500;display:flex;align-items:center;gap:8px}
.eyebrow::after{content:"";height:1px;width:18px;background:#E2D6BC}
.h1{font-family:var(--serif);font-weight:400;font-size:22px;line-height:1.5;letter-spacing:.01em;margin:0}
.h2{font-family:var(--serif);font-weight:400;font-size:16.5px;line-height:1.55;letter-spacing:.01em;margin:0}
.h3{font-family:var(--serif);font-weight:500;font-size:14px;line-height:1.6;margin:0}
.lede{font-size:12.5px;line-height:1.95;color:var(--ink-2);font-weight:300;letter-spacing:.01em}
.small{font-size:11.5px;color:var(--muted)}
.mono-num{font-family:var(--latin);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.quote-serif{font-family:var(--serif);font-style:italic}

/* ============ utils ============ */
.row{display:flex;align-items:center}
.between{display:flex;align-items:center;justify-content:space-between;gap:14px}
.gap-6{gap:6px}.gap-8{gap:8px}.gap-10{gap:10px}.gap-12{gap:12px}.gap-16{gap:16px}.gap-20{gap:20px}
.wrap{flex-wrap:wrap}
.stack{display:flex;flex-direction:column}
.grow{flex:1;min-width:0}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:1fr}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
.hair{height:1px;background:var(--line);margin:22px 0}
.sec-head{margin:0 0 12px}
.sec-title{display:flex;align-items:baseline;gap:10px}
.link-more{font-size:11.5px;letter-spacing:.04em;color:var(--muted);cursor:pointer}
.link-more:active{color:var(--gold-deep)}

/* ============ card ============ */
.card{background:var(--card);border:1px solid var(--line-2);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:15px 15px}
.pad-lg{padding:17px 15px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}

/* ============ buttons ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  height:40px;padding:0 16px;border-radius:12px;border:1px solid var(--line-strong);
  background:var(--card);color:var(--ink);font-size:12.5px;letter-spacing:.04em;
  cursor:pointer;transition:.16s;white-space:nowrap;
}
.btn:active{transform:scale(.985);background:var(--paper-2)}
.btn--ink{background:var(--ink);border-color:var(--ink);color:#FBF7EF}
.btn--ink:active{background:#37322a}
.btn--gold{background:var(--gold-soft);border-color:#E3D3B3;color:var(--gold-deep)}
.btn--ghost{background:transparent;border-color:var(--line);color:var(--ink-2)}
.btn--sm{height:32px;padding:0 12px;font-size:11.5px;border-radius:10px}
.btn--xs{height:26px;padding:0 9px;font-size:10.5px;border-radius:8px}
.btn--danger{color:#8E5A50;border-color:#EAD8D2;background:#FDF6F4}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn-block{width:100%}
.icon-btn{width:36px;height:36px;padding:0;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:var(--card);cursor:pointer;color:var(--muted)}
.icon-btn svg{width:15px;height:15px}

/* ============ chips / tags ============ */
.chip{
  display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 12px;border-radius:16px;
  border:1px solid var(--line);background:var(--card);font-size:11.5px;color:var(--muted);
  cursor:pointer;transition:.16s;white-space:nowrap;
}
.chip.active{background:#FFFDF7;border-color:#2B2721;color:var(--ink);font-weight:500}
.chip .cnt{font-family:var(--latin);font-size:10.5px;opacity:.65}
.tag{display:inline-flex;align-items:center;height:19px;padding:0 7px;border-radius:5px;background:var(--paper-2);border:1px solid var(--line);font-size:9.5px;letter-spacing:.05em;color:var(--muted);text-transform:uppercase}
.tag-sage{background:var(--sage-soft);border-color:#DEE6D8;color:var(--sage-deep)}
.tag-gold{background:var(--gold-soft);border-color:#EBDFC0;color:var(--gold-deep)}
.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:20px;font-size:10.5px;border:1px solid var(--line);background:var(--paper-2);color:var(--muted)}
.dot{width:5px;height:5px;border-radius:50%;background:var(--sage);display:inline-block}
.dot-gold{background:var(--gold)}
.dot-rose{background:var(--rose)}
.dot-muted{background:var(--muted-2)}

/* ============ status ============ */
.st{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:3px 9px;border-radius:20px;border:1px solid;letter-spacing:.02em;white-space:nowrap}
.st-pending{color:#8A6B2C;background:#FBF4E4;border-color:#EBDFBF}
.st-review{color:#7A6A55;background:#F7F2E8;border-color:#E6DCC9}
.st-done{color:var(--sage-deep);background:var(--sage-soft);border-color:#DAE3D4}
.st-wait{color:#8E6B46;background:#FAF1E5;border-color:#EADCC6}
.st-fix{color:#4F6E52;background:#EAF1E6;border-color:#D3E0CC}
.st-ignore{color:var(--muted);background:var(--paper-2);border-color:var(--line)}

/* ============ avatar ============ */
.avatar{
  width:34px;height:34px;flex:0 0 34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-size:14px;color:#5C5647;border:1px solid var(--line);background:var(--paper-2);overflow:hidden;
}
.avatar.lg{width:74px;height:74px;flex:0 0 74px;font-size:30px}
.avatar.sm{width:28px;height:28px;flex:0 0 28px;font-size:12px}
.avatar img{width:100%;height:100%;object-fit:cover}

/* ============ forms ============ */
.field{display:flex;flex-direction:column;gap:7px;margin-bottom:16px}
.label{font-size:12px;letter-spacing:.03em;color:var(--ink-2);display:flex;align-items:center;gap:5px}
.label .req{color:var(--gold);font-size:10px}
.input,.select,.textarea{
  width:100%;border:1px solid var(--line);border-radius:13px;background:var(--card);
  padding:11px 13px;font-size:14px;color:var(--ink);outline:none;transition:.16s;line-height:1.65;
}
.input:focus,.select:focus,.textarea:focus{border-color:var(--sage);box-shadow:0 0 0 3px rgba(139,155,129,.12)}
.input::placeholder,.textarea::placeholder{color:#B9B1A0}
.textarea{resize:vertical;min-height:96px}
.select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M1 1l4 4 4-4' stroke='%23867E6D' fill='none' stroke-width='1.2'/></svg>");background-repeat:no-repeat;background-position:right 14px center;padding-right:34px;cursor:pointer}
.hint{font-size:11.5px;color:var(--muted-2);line-height:1.7}
.err{font-size:11.5px;color:#A2685C}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{
  display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 11px;border-radius:9px;
  border:1px solid var(--line);background:var(--card);font-size:11.5px;color:var(--muted);cursor:pointer;transition:.16s;
}
.opt.on{border-color:var(--sage-deep);background:var(--sage-soft);color:var(--sage-deep)}
.opt input{display:none}

/* ============ sheet / modal ============ */
.modal-root{position:fixed;inset:0;z-index:200;display:none}
.modal-root.on{display:block}
.scrim{position:absolute;inset:0;background:rgba(40,35,26,.34);backdrop-filter:blur(2px);animation:fade .2s ease both}
.sheet-wrap{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center}
.modal{
  width:100%;max-width:430px;max-height:88vh;display:flex;flex-direction:column;
  background:var(--card);border-radius:26px 26px 0 0;overflow:hidden;
  box-shadow:0 -24px 60px -30px rgba(50,42,28,.45);
  animation:sheetUp .3s cubic-bezier(.2,.8,.3,1) both;
}
@keyframes sheetUp{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.modal-grab{height:18px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.modal-grab span{width:38px;height:4px;border-radius:4px;background:var(--line-strong)}
.modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:2px 18px 12px;flex:0 0 auto}
.modal-body{padding:2px 18px 18px;overflow-y:auto}
.modal-body .g2{grid-template-columns:1fr}
.modal-foot{padding:12px 18px calc(16px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line-2);display:flex;justify-content:flex-end;gap:8px;flex:0 0 auto;background:var(--card)}
.modal-foot .btn{flex:1}

/* ============ toast ============ */
.toasts{position:fixed;left:50%;bottom:calc(var(--tab) + 22px);transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:8px;align-items:center;width:100%}
.toast{
  background:var(--ink);color:#F7F2E6;font-size:12.5px;letter-spacing:.02em;padding:10px 18px;border-radius:12px;
  box-shadow:0 12px 30px -14px rgba(0,0,0,.5);animation:toastIn .28s ease both;max-width:88%;
}
@keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ============ home ============ */
.hero{padding:2px 0 16px}
.hero h1{margin:10px 0 10px;font-size:21px;line-height:1.58}
.hero h1 em{font-style:normal;color:var(--gold-deep);border-bottom:1px solid #DCC9A2;padding-bottom:1px}
.hero .lede{margin:0;max-width:300px}
.hstats{display:flex;gap:20px;margin-top:20px}
.hstat{min-width:0}
.hstat .n{font-family:var(--latin);font-size:19px;line-height:1;color:var(--ink)}
.hstat .c{font-size:8.5px;letter-spacing:.18em;color:var(--muted-2);text-transform:uppercase;margin-top:5px}

/* story rail */
.rail{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:4px 16px 2px;margin:6px -16px 2px}
.rail::-webkit-scrollbar{display:none}
.story{flex:0 0 52px;width:52px;text-align:center;cursor:pointer}
.story .ring{
  width:50px;height:50px;border-radius:50%;margin:0 auto;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--line);background:var(--card);color:var(--sage-deep);transition:.16s;
}
.story .ring svg{width:18px;height:18px}
.story:active .ring{transform:scale(.96);border-color:var(--sage)}
.story .lab{font-size:10px;color:var(--ink-2);margin-top:6px;line-height:1.3}

/* announcement strip */
.notice-strip{
  display:flex;align-items:center;gap:9px;padding:10px 13px;margin-top:16px;
  background:var(--gold-soft);border-radius:12px;color:#6F5622;font-size:11.5px;line-height:1.6;
}
.notice-strip b{font-weight:500;flex:0 0 auto;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:#9A7B33}
.notice-strip span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* section */
.sec{margin-top:24px}
.sec .head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:11px}
.sec .head .t{font-family:var(--serif);font-size:15px;letter-spacing:.02em}
.sec .head .s{font-size:8.5px;letter-spacing:.24em;color:var(--muted-2);text-transform:uppercase;display:block;margin-bottom:6px}

/* ============ resource tile ============ */
.res{background:transparent;border:none;box-shadow:none;padding:0;cursor:pointer;min-width:0}
.res-thumb{
  position:relative;aspect-ratio:1/1;border-radius:12px;display:flex;align-items:center;justify-content:center;
  overflow:hidden;border:1px solid rgba(0,0,0,.03);
}
.res-thumb .rt-frame{position:absolute;inset:10px;border:1px solid currentColor;opacity:.26;border-radius:5px}
.res-thumb .rt-glyph{position:relative;font-family:var(--serif);font-size:25px;color:#7E8A76;letter-spacing:.1em}
.res-thumb .rt-cat{
  position:absolute;left:6px;bottom:6px;right:6px;font-size:8.5px;letter-spacing:.06em;
  padding:2px 6px;border-radius:20px;background:rgba(255,255,255,.74);color:#5E5A4B;
  backdrop-filter:blur(4px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.res-body{padding:7px 1px 0;display:flex;flex-direction:column;gap:2px}
.res-name{font-size:11.5px;line-height:1.5;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.res-desc,.res-foot{display:none}

/* ============ praise post ============ */
.praise{padding:14px 14px 11px;display:flex;flex-direction:column;margin-bottom:11px;background:var(--card);border:1px solid var(--line-2);border-radius:var(--r);box-shadow:var(--sh)}
.praise .p-head{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.praise .p-name{font-size:12px;color:var(--ink);line-height:1.3}
.praise .p-sub{font-size:9.5px;color:var(--muted-2);margin-top:2px;letter-spacing:.02em}
.praise .p-kind{margin-left:auto;font-size:9px;letter-spacing:.08em;color:var(--gold-deep);background:var(--gold-soft);border-radius:20px;padding:3px 8px;flex:0 0 auto}
.praise .p-text{font-family:var(--serif);font-size:13.5px;line-height:1.95;color:var(--ink-2);margin:0 0 9px;letter-spacing:.01em}
.praise .p-target{display:inline-flex;align-self:flex-start;align-items:center;gap:5px;font-size:10.5px;color:var(--sage-deep);background:var(--sage-soft);border-radius:7px;padding:3px 8px;margin-bottom:3px;max-width:100%}
.praise .p-target svg{width:12px;height:12px}
.praise .p-mark{display:none}
.praise .p-meta{display:flex;align-items:center;gap:18px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line-2);font-size:11px;color:var(--muted-2)}
.like{display:inline-flex;align-items:center;gap:5px;cursor:pointer;color:var(--muted);transition:.16s;font-size:11.5px}
.like.on{color:var(--gold-deep)}
.like svg{width:16px;height:16px;stroke:currentColor;stroke-width:1.45;fill:none}
.like.on svg{fill:var(--gold-soft);stroke:var(--gold-deep)}

/* ============ chat ============ */
.chat-page{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--bg)}
.chat-head{padding:10px 0 8px;background:var(--bg);flex:0 0 auto;border-bottom:1px solid var(--line-2)}
.chat-tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:0 16px}
.chat-tabs::-webkit-scrollbar{display:none}
.chat-tab{padding:6px 10px;border-radius:16px;font-size:11.5px;color:var(--muted);cursor:pointer;white-space:nowrap;border:1px solid var(--line-2);background:var(--card)}
.chat-tab.active{background:#FFFDF7;border-color:#2B2721;color:var(--ink);font-weight:500}
.chat-guard{display:flex;align-items:center;gap:7px;padding:9px 16px 0;font-size:10.5px;color:var(--sage-deep)}
.chat-guard svg{width:13px;height:13px}
.chat-body{flex:1;min-height:0;overflow-y:auto;padding:16px 16px 10px;display:flex;flex-direction:column;gap:14px}
.chat-body>div:first-child{margin-top:auto}
.msg{display:flex;gap:9px;max-width:84%}
.msg .m-body{min-width:0}
.msg .m-top{display:flex;align-items:baseline;gap:7px;margin-bottom:4px}
.msg .m-name{font-size:11.5px;color:var(--ink-2)}
.msg .m-time{font-family:var(--latin);font-size:10px;color:var(--muted-2)}
.msg .m-text{font-size:13.5px;line-height:1.8;color:var(--ink-2);background:var(--card);border:1px solid var(--line-2);border-radius:4px 16px 16px 16px;padding:9px 13px;display:inline-block;white-space:pre-wrap;word-break:break-word;max-width:100%}
.msg .m-text.img{padding:4px;max-width:230px}
.msg .m-text img{border-radius:12px}
.msg .m-reply{font-size:11px;color:var(--muted);border-left:2px solid var(--line-strong);padding-left:8px;margin-bottom:5px}
.msg .m-actions{display:flex;gap:12px;margin-top:5px;font-size:10.5px;color:var(--muted-2)}
.msg.mine{align-self:flex-end;flex-direction:row-reverse}
.msg.mine .m-top{justify-content:flex-end}
.msg.mine .m-text{background:var(--sage-soft);border-color:#DCE4D5;border-radius:16px 4px 16px 16px;color:#3F4A39}
.chat-composer{flex:0 0 auto;border-top:1px solid var(--line-2);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--chrome);backdrop-filter:blur(14px);display:flex;flex-direction:column;gap:8px}
.composer-tools{display:flex;align-items:center;gap:4px}
.tool-btn{width:32px;height:32px;border-radius:9px;border:none;background:transparent;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.tool-btn svg{width:16px;height:16px}
.composer-row{display:flex;gap:8px;align-items:flex-end}
.composer-input{flex:1;border:1px solid var(--line);border-radius:15px;background:var(--card);padding:9px 13px;font-size:12.5px;resize:none;outline:none;min-height:38px;max-height:104px;line-height:1.6}
.composer-input:focus{border-color:var(--sage)}
.emoji-bar{display:flex;gap:2px;flex-wrap:wrap}
.emoji-bar span{cursor:pointer;font-size:17px;padding:2px 4px;border-radius:8px}

/* ============ profile ============ */
.profile-top{display:flex;align-items:center;gap:16px;padding:4px 0 18px}
.profile-top .pt-main{min-width:0;flex:1}
.pstats{display:flex;gap:0;margin:0 0 16px;border:1px solid var(--line-2);border-radius:18px;background:var(--card);overflow:hidden}
.stat{padding:13px 8px;text-align:center;border-right:1px solid var(--line-2);cursor:pointer;flex:1;min-width:0}
.stat:last-child{border-right:none}
.stat .s-num{font-family:var(--latin);font-size:19px;line-height:1;color:var(--ink)}
.stat .s-cap{font-size:9px;letter-spacing:.1em;color:var(--muted-2);text-transform:uppercase;margin-top:5px}

/* ============ admin tabs / lists ============ */
.admin-tabs{display:flex;flex-wrap:wrap;gap:6px;margin:20px 0 18px}
.atab{display:inline-flex;align-items:center;gap:5px;padding:6px 10px;border-radius:8px;font-size:11px;color:var(--muted);cursor:pointer;border:1px solid var(--line-2);background:var(--card);white-space:nowrap}
.atab.active{color:var(--ink);border-color:#CFC2A8;background:#FFFDF6;font-weight:500}
.atab b{font-family:var(--latin);font-size:9.5px;font-weight:400;color:var(--gold-deep)}
.pane-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:0 0 12px}
.pane-head .s{display:block;font-size:8.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted-2);margin-bottom:5px}
.arow{background:var(--card);border:1px solid var(--line-2);border-radius:var(--r-sm);padding:12px 13px;margin-bottom:9px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--sh)}
.arow .quote{margin-top:0}
.quote{font-size:11px;line-height:1.8;color:var(--ink-2);background:var(--paper-2);border-radius:8px;padding:8px 10px;margin-top:9px;word-break:break-word}
.quote-serif{font-family:var(--serif);font-style:italic}
.mx{padding:2px 0}
.mx-h,.mx-r{display:grid;grid-template-columns:1fr 42px 42px 42px;align-items:center;gap:4px;padding:8px 12px}
.mx-h{font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted-2);border-bottom:1px solid var(--line)}
.mx-r{font-size:11px;color:var(--ink-2);border-bottom:1px solid var(--line-2)}
.mx-r:last-child{border-bottom:none}
.mx-c{text-align:center;font-family:var(--latin);font-size:12px}
.tbl{width:100%;border-collapse:collapse;font-size:11px;min-width:0}
.tbl th{text-align:left;font-weight:400;font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted-2);padding:0 8px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:10px 8px;border-bottom:1px solid var(--line-2);vertical-align:middle;color:var(--ink-2)}
.tbl tr:last-child td{border-bottom:none}
.tbl .t-act{display:flex;gap:5px}
.card:has(table){overflow-x:auto;padding:12px 4px 4px}

/* ============ misc ============ */
.kv{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px dashed var(--line-2);font-size:12.5px}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--muted);flex:0 0 auto}
.kv .v{color:var(--ink-2);text-align:right;min-width:0}
.empty{padding:40px 18px;text-align:center;color:var(--muted-2);font-size:11.5px}
.empty .e-mark{font-family:var(--latin);font-size:26px;color:#E4DAC4;display:block;margin-bottom:8px}

/* 空态：一条细线 + 一句平静的说明 + 可选动作 */
.blank{padding:16px 0 4px;display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.blank.big{padding:30px 0 8px;align-items:center;text-align:center}
.blank .b-line{display:none}
.blank.big .b-line{display:block;width:26px;height:1px;background:var(--line-strong)}
.blank p{margin:0;font-size:11.5px;line-height:1.85;color:var(--muted);max-width:280px}
.blank .b-t{font-family:var(--serif);font-size:14px;color:var(--ink-2);max-width:none}
.blank .btn{margin-top:2px}

/* 聊天空频道 */
.chat-empty{margin:auto;display:flex;flex-direction:column;align-items:center;gap:9px;padding:20px;text-align:center}
.chat-empty .ce-line{width:26px;height:1px;background:var(--line-strong)}
.chat-empty p{margin:0;font-size:12px;color:var(--ink-2);font-family:var(--serif)}
.chat-empty span{font-size:10.5px;color:var(--muted-2)}

/* 门（初始化 / 登录 / 待审核） */
.gate{padding:20px 2px 36px;text-align:left}
.gate .g-mark{
  width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:var(--latin);font-size:19px;color:var(--gold-deep);
  border:1px solid #E3D3B3;background:var(--gold-soft);letter-spacing:.08em;
}
.gate .g-h1{font-family:var(--serif);font-weight:400;font-size:23px;line-height:1.55;margin:10px 0 10px;letter-spacing:.01em}
.gate .g-p{font-size:12px;line-height:1.95;color:var(--muted);margin:0 0 22px;max-width:300px;font-weight:300}
.gate .g-form{margin-top:16px}
.gate .g-form .field{margin-bottom:14px}
.gate .g-tabs{display:flex;gap:4px;background:var(--paper-2);border:1px solid var(--line);border-radius:12px;padding:3px;margin:0 0 4px}
.gate .g-tab{flex:1;text-align:center;padding:9px 0;font-size:11.5px;color:var(--muted-2);cursor:pointer;border-radius:9px;letter-spacing:.03em;transition:background .18s ease,color .18s ease}
.gate .g-tab.on{background:var(--paper);color:var(--ink);border:1px solid var(--line);margin:-1px;font-weight:500}
.gate .g-note{font-size:10.5px;line-height:1.85;color:var(--muted-2);margin:26px 0 0;padding-top:14px;border-top:1px solid var(--line-2)}
.gate .card{margin-left:0;margin-right:0}

/* 门模式：进入前不显示底栏，顶栏只留品牌 */
.phone.gate-mode .tabbar{display:none}
.phone.gate-mode #menuBtn,
.phone.gate-mode #abAvatar{visibility:hidden}

.banner{display:flex;align-items:flex-start;gap:9px;padding:11px 13px;border:1px solid #EBDFC0;background:var(--gold-soft);border-radius:12px;font-size:11px;line-height:1.75;color:#6F5622}
.banner svg{width:14px;height:14px;margin-top:2px;flex:0 0 14px}
.prod-ico{width:44px;height:44px;flex:0 0 44px;border-radius:14px;border:1px solid var(--line);background:var(--paper-2);display:flex;align-items:center;justify-content:center;color:var(--sage-deep)}
.prod-ico svg{width:19px;height:19px}
.hero-card{background:var(--card);border:1px solid var(--line-2);border-radius:18px;padding:16px 16px;box-shadow:var(--sh)}
.hero-card .q{font-family:var(--serif);font-style:italic;font-size:13.5px;line-height:1.9;color:var(--ink-2)}
.hero-card .sig{margin-top:12px;font-size:9.5px;letter-spacing:.16em;color:var(--muted-2);text-transform:uppercase}
.meta-num{font-family:var(--latin);font-size:22px;line-height:1;color:var(--ink)}
.meta-cap{font-size:9px;letter-spacing:.16em;color:var(--muted-2);text-transform:uppercase;margin-top:5px}
.menu-sheet-list{display:flex;flex-direction:column;padding:0 4px}
.menu-item{display:flex;align-items:center;gap:12px;padding:13px 10px;border-bottom:1px solid var(--line-2);cursor:pointer;font-size:14px}
.menu-item:last-child{border-bottom:none}
.menu-item svg{width:18px;height:18px;opacity:.7}
.menu-item .mi-note{margin-left:auto;font-size:11px;color:var(--muted-2)}

/* ============================================================
   INS REFRESH —— 白底 / 大留白 / 圆角 / 单一强调色
   只覆盖视觉，不动任何交互与数据结构
   ============================================================ */
:root{
  --bg:#FFFFFF;
  --card:#FFFFFF;
  --chrome:rgba(255,255,255,.88);
  --ivory:#FFFFFF;
  --ivory-deep:#FAFAFB;
  --paper-2:#F6F6F8;
  --ink:#111114;
  --ink-2:#3D3D45;
  --muted:#8B8B94;
  --muted-2:#B5B5BE;
  --line:#EFEFF2;
  --line-2:#F5F5F7;
  --line-strong:#E6E6EA;
  --sage:#E8405A;
  --sage-deep:#D22E48;
  --sage-soft:#FFF1F3;
  --gold:#A0A0A8;
  --gold-deep:#D22E48;
  --gold-soft:#FFF4F6;
  --rose:#E8405A;
  --serif:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  --latin:"Noto Sans SC","PingFang SC",system-ui, sans-serif;
  --r:18px;--r-sm:14px;--r-xs:10px;
  --sh:none;
  --sh-lg:0 20px 60px -34px rgba(0,0,0,.28);
  --bar:54px;--tab:54px;
}
body{background:#F3F3F6;font-size:14px;line-height:1.62;color:var(--ink);letter-spacing:0}
body::after{display:none}
::selection{background:#FFE2E7;color:#B01F36}
svg{stroke-width:1.6}
.phone{background:#fff}
@media (min-width:520px){
  body{background:#F3F3F6}
  .phone{border-radius:40px;box-shadow:0 40px 90px -50px rgba(0,0,0,.45),0 0 0 1px #EAEAEE}
}
#view{padding:20px 18px 26px}

/* 顶栏 */
.appbar{height:54px;background:#fff;backdrop-filter:none;border-bottom:1px solid var(--line);z-index:20}
.ab-title{font-family:var(--sans);font-size:13.5px;font-weight:700;letter-spacing:.24em;color:var(--ink)}
.ab-title-cn{font-family:var(--sans);font-size:14px;font-weight:650;letter-spacing:-.01em;color:var(--ink)}
.ab-sub{font-size:7.5px;letter-spacing:.16em;color:var(--muted);margin-top:5px;font-weight:400}
.ab-btn{width:40px;height:40px;border-radius:50%}
.ab-btn:active{background:var(--paper-2)}

/* 底栏 */
.tabbar{background:rgba(255,255,255,.96);backdrop-filter:blur(22px);border-top:1px solid var(--line)}
.tab{font-size:9.5px;letter-spacing:.02em;color:#ADADB6;gap:4px}
.tab.on{color:var(--ink);font-weight:600}
.tab.on svg{color:var(--ink);stroke-width:1.85}
.tab svg{width:20px;height:20px;stroke-width:1.5}
.tab .tab-av{width:22px;height:22px;font-family:var(--sans);font-weight:600;font-size:11px;border:none;background:var(--paper-2);color:var(--ink)}
.tab .tab-av.on{box-shadow:0 0 0 1.5px var(--ink);border-color:transparent}

/* 字号体系 */
.eyebrow{font-size:9px;letter-spacing:.2em;color:var(--muted);font-weight:700;text-transform:uppercase;gap:7px}
.eyebrow::after{background:var(--accent-line,#E8405A);opacity:.55;width:14px}
.h1{font-family:var(--sans);font-size:26px;font-weight:700;line-height:1.26;letter-spacing:-.02em}
.h2{font-family:var(--sans);font-size:19px;font-weight:650;line-height:1.4;letter-spacing:-.015em}
.h3{font-family:var(--sans);font-size:15px;font-weight:600;line-height:1.45;letter-spacing:-.01em}
.lede{font-size:12.5px;line-height:1.8;color:var(--muted);font-weight:400}
.small{font-size:11.5px;color:var(--muted)}
.quote-serif{font-style:normal;font-family:var(--sans)}
.sec-head .t, .sec .head .t{font-family:var(--sans);font-size:16px;font-weight:650;letter-spacing:-.01em}
.sec .head .s{display:none}
.hair{background:var(--line);margin:24px 0}

/* 卡片 / 按钮 / 输入 */
.card{border:1px solid var(--line);border-radius:18px;box-shadow:none}
.pad{padding:16px}
.pad-lg{padding:18px}
.btn{height:44px;border-radius:999px;border:1px solid var(--line-strong);background:#fff;font-size:13px;font-weight:500;letter-spacing:0;padding:0 18px}
.btn:active{transform:scale(.99);background:#FAFAFB}
.btn--ink{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
.btn--ink:active{background:#2A2A31}
.btn--gold{background:var(--sage-soft);border-color:transparent;color:var(--accent-ink,#C7263E);font-weight:500}
.btn--ghost{background:var(--paper-2);border-color:transparent;color:var(--ink-2)}
.btn--sm{height:34px;font-size:12px;padding:0 14px;border-radius:999px}
.btn--xs{height:28px;font-size:11px;padding:0 11px;border-radius:999px}
.btn--danger{color:#C7263E;background:#FFF4F5;border-color:transparent}
.icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--ink)}
.input,.select,.textarea{background:var(--paper-2);border:1px solid transparent;border-radius:14px;padding:13px 14px;font-size:14px;color:var(--ink)}
.input:focus,.select:focus,.textarea:focus{background:#fff;border-color:var(--line-strong);box-shadow:0 0 0 3px rgba(17,17,20,.05)}
.input::placeholder,.textarea::placeholder{color:#BFC0C6}
.label{font-size:12px;color:var(--ink-2);font-weight:600;letter-spacing:0}
.label .req{color:var(--accent,#E8405A)}
.hint{color:var(--muted);font-size:11.5px}
.err{color:#C7263E}
.opt{border:none;background:var(--paper-2);border-radius:999px;font-size:12px;color:var(--muted)}
.opt.on{background:var(--ink);color:#fff;border-color:transparent}

/* 标签 / 头像 */
.chip{height:32px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:12px;color:var(--ink-2);padding:0 14px}
.chip.active{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:500}
.tag{border:none;background:var(--paper-2);border-radius:999px;color:var(--muted);font-size:9.5px;letter-spacing:.02em;height:20px}
.pill{border:none;background:var(--paper-2);border-radius:999px;color:var(--ink-2);font-size:11px;height:23px}
.st{border:none;border-radius:999px;font-size:10.5px;padding:4px 10px;background:var(--paper-2);color:var(--ink-2);letter-spacing:.02em}
.st-pending{background:#FFF7E8;color:#94631A}
.st-review{background:#F4F4F7;color:var(--ink-2)}
.st-done{background:#F0FAF3;color:#2F7A45}
.st-wait{background:#FFF7E8;color:#94631A}
.st-fix{background:#F0FAF3;color:#2F7A45}
.st-ignore{background:var(--paper-2);color:var(--muted)}
.avatar{border:none;background:var(--paper-2);color:var(--ink-2);font-family:var(--sans);font-weight:600;border-radius:50%}
.avatar.lg{width:76px;height:76px;flex-basis:76px;font-size:24px}
.avatar.xl{width:80px;height:80px;flex:0 0 80px;font-size:26px;border:3px solid #fff;box-shadow:0 8px 22px -12px rgba(0,0,0,.4);background:#fff}
.dot{background:var(--muted-2)}
.dot-gold,.dot-rose{background:var(--accent,#E8405A)}

/* 首页 */
.hero{padding:4px 0 8px}
.hero h1{font-family:var(--sans);font-size:27px;font-weight:700;line-height:1.28;letter-spacing:-.025em;margin:12px 0 10px}
.hero h1 em{color:inherit;border-bottom:none;font-style:normal}
.hero .lede{max-width:320px}
.hstats{gap:26px;margin-top:22px}
.hstat .n{font-family:var(--sans);font-size:22px;font-weight:700;letter-spacing:-.02em}
.hstat .c{font-size:9px;letter-spacing:.14em;color:var(--muted-2);margin-top:6px}
.rail{gap:10px;padding:6px 18px 2px;margin:8px -18px 2px}
.story{flex:0 0 60px;width:60px}
.story .ring{width:56px;height:56px;border:2px solid transparent;border-radius:50%;color:var(--ink);position:relative;z-index:0;
  background-image:linear-gradient(#fff,#fff),linear-gradient(135deg,#FFC46B,#E8405A 50%,#845EF7);
  background-origin:border-box;background-clip:padding-box,border-box}
.story .ring svg{width:19px;height:19px}
.story:active .ring{transform:scale(.97)}
.story .lab{font-size:10px;color:var(--ink-2);margin-top:8px}
.notice-strip{background:var(--paper-2);border-radius:14px;color:var(--ink-2);font-size:11.5px;padding:11px 14px;margin-top:18px}
.notice-strip b{color:var(--accent,#E8405A);font-size:8.5px;letter-spacing:.16em}
.sec{margin-top:26px}
.sec .head{margin-bottom:12px}
.link-more{color:var(--muted);font-size:11.5px}

/* 资源格子 */
.res-thumb{border:none;border-radius:14px;background:var(--paper-2)}
.res-thumb .rt-frame{display:none}
.res-thumb .rt-glyph{font-family:var(--sans);font-size:24px;font-weight:600;color:var(--ink-2)}
.res-thumb .rt-cat{background:rgba(255,255,255,.9);border-radius:999px;font-size:8.5px;color:var(--ink-2);left:7px;bottom:7px}
.res-body{padding:8px 2px 0}
.res-name{font-size:11.5px;color:var(--ink-2);font-weight:450}

/* 夸夸 */
.praise{border:none;background:#fff;border-radius:18px;box-shadow:0 0 0 1px var(--line);padding:16px 15px 13px}
.praise .p-name{font-size:12.5px;font-weight:600;color:var(--ink)}
.praise .p-sub{color:var(--muted-2);font-size:9.5px}
.praise .p-kind{background:var(--paper-2);color:var(--muted);border-radius:999px;font-size:9px;padding:3px 9px}
.praise .p-text{font-family:var(--sans);font-size:13.5px;line-height:1.75;color:var(--ink);font-weight:450;margin:2px 0 10px}
.praise .p-target{background:var(--paper-2);color:var(--ink-2);border-radius:999px;font-size:10.5px}
.praise .p-meta{border-top:1px solid var(--line);color:var(--muted-2);font-size:11px}
.like{font-size:11.5px;color:var(--muted)}
.like.on{color:var(--accent,#E8405A)}
.like.on svg{fill:#FFF1F3;stroke:var(--accent,#E8405A)}

/* 聊天 */
.chat-head{background:#fff;border-bottom:1px solid var(--line);padding:10px 0 10px}
.chat-tab{border:none;background:var(--paper-2);border-radius:999px;font-size:12px;color:var(--ink-2);padding:7px 13px}
.chat-tab.active{background:var(--ink);color:#fff;border-color:transparent;font-weight:600}
.chat-guard{color:var(--muted)}
.chat-body{gap:16px}
.msg{max-width:82%}
.msg .m-name{font-size:11.5px;font-weight:600;color:var(--ink-2)}
.msg .m-time{color:var(--muted-2);font-family:var(--sans)}
.msg .m-text{border:none;background:var(--paper-2);border-radius:16px 16px 16px 5px;color:var(--ink);font-size:13.5px;padding:10px 14px}
.msg.mine .m-text{background:var(--ink);color:#fff;border-radius:16px 16px 5px 16px}
.msg .m-reply{border-left:2px solid var(--line-strong);color:var(--muted)}
.composer-input{background:var(--paper-2);border:none;border-radius:20px;padding:11px 15px;font-size:13px}
.composer-input:focus{border:none;background:#F1F1F4}
.chat-composer{background:#fff;border-top:1px solid var(--line)}
.tool-btn{color:var(--ink-2)}
.chat-empty p{font-family:var(--sans);font-weight:600}
.chat-empty .ce-line{background:var(--accent,#E8405A);opacity:.35}

/* 个人页：封面 + 浮头像 */
.cover{height:150px;margin:-20px -18px 0;background-color:#F2F2F5;background-position:center;background-size:cover;position:relative}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.04),rgba(0,0,0,.12))}
.cover .cover-edit{position:absolute;right:12px;top:12px;z-index:2;height:30px;padding:0 12px;border-radius:999px;background:rgba(255,255,255,.86);backdrop-filter:blur(8px);border:none;font-size:11px;color:var(--ink);display:inline-flex;align-items:center;gap:5px;cursor:pointer}
.me-head{display:flex;align-items:flex-end;gap:14px;margin-top:-40px;position:relative;padding:0 0 14px}
.me-head .pt-main{flex:1;min-width:0;padding-bottom:2px}
.me-name{font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.me-id{font-size:10px;letter-spacing:.1em;color:var(--muted);margin-top:5px;display:flex;align-items:center;gap:6px}
.me-id b{font-weight:600;color:var(--ink-2);letter-spacing:.06em}
.me-head .icon-btn{flex:0 0 38px;width:38px;height:38px;margin-bottom:4px}
.pstats{border:none;background:var(--paper-2);border-radius:16px;margin-bottom:18px}
.stat{border-right:none;padding:14px 6px}
.stat .s-num{font-family:var(--sans);font-size:18px;font-weight:700;letter-spacing:-.02em}
.stat .s-cap{font-size:9.5px;letter-spacing:.08em;color:var(--muted);text-transform:none;margin-top:6px}
.profile-top{display:none}

/* 管理后台：深色控制台头，和站内页明显不同 */
.console{background:#111114;color:#fff;border-radius:22px;padding:22px 20px;margin:-4px 0 20px;position:relative;overflow:hidden}
.console::after{content:"";position:absolute;right:-40px;top:-60px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,#E8405A33,transparent 68%)}
.console .eyebrow{color:rgba(255,255,255,.5)}
.console .eyebrow::after{background:#E8405A}
.console .c-title{font-size:21px;font-weight:700;letter-spacing:-.02em;margin-top:8px}
.console .c-sub{font-size:11.5px;line-height:1.7;color:rgba(255,255,255,.52);margin-top:8px;max-width:270px}
.console .c-metrics{display:flex;gap:24px;margin-top:20px}
.console .c-metrics .m .n{font-size:20px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.console .c-metrics .m .l{font-size:9px;letter-spacing:.14em;color:rgba(255,255,255,.45);text-transform:uppercase;margin-top:4px}
.admin-tabs{gap:8px;margin:0 0 16px}
.atab{border:none;background:var(--paper-2);border-radius:999px;font-size:12px;color:var(--ink-2);padding:7px 13px}
.atab.active{background:var(--ink);border-color:transparent;color:#fff;font-weight:600}
.atab b{color:inherit;opacity:.55;font-family:var(--sans);font-weight:600;font-size:9.5px;margin-left:3px}
.arow{border:1px solid var(--line);border-radius:16px;box-shadow:none;padding:14px}
.quote{background:var(--paper-2);border-radius:12px;font-size:11.5px;color:var(--ink-2)}

/* 空态 / 横幅 / 菜单 */
.blank p,.empty{color:var(--muted)}
.empty .e-mark{font-family:var(--sans);color:#DDDDE2;font-weight:700}
.banner{background:var(--paper-2);border:none;border-radius:14px;color:var(--ink-2);font-size:11.5px}
.banner svg{color:var(--accent,#E8405A)}
.hero-card{border:1px solid var(--line);border-radius:20px;box-shadow:none}
.hero-card .q{font-family:var(--sans);font-style:normal;font-size:13.5px;font-weight:450;color:var(--ink)}
.hero-card .sig{color:var(--muted-2)}
.menu-item{font-size:14px;border-bottom:1px solid var(--line)}
.modal{border-radius:24px 24px 0 0}
.modal-grab span{background:#E7E7EB}
.modal-foot{border-top:1px solid var(--line)}
.toast{background:#111114;color:#fff;border-radius:999px;font-size:12.5px;padding:11px 20px}

/* 入口页 */
.gate{padding:16px 2px 32px}
.gate .g-mark{width:46px;height:46px;border:none;background:var(--ink);color:#fff;font-family:var(--sans);font-weight:700;font-size:17px;letter-spacing:0}
.gate .g-h1{font-family:var(--sans);font-size:28px;font-weight:700;line-height:1.24;letter-spacing:-.03em;margin:14px 0 12px}
.gate .g-p{font-size:12.5px;color:var(--muted);line-height:1.8;max-width:320px;font-weight:400}
.gate .g-tabs{background:var(--paper-2);border:none;border-radius:999px;padding:3px;margin:16px 0 18px}
.gate .g-tab{padding:9px 0;border-radius:999px;font-size:12.5px;font-weight:500;color:var(--muted);transition:.18s}
.gate .g-tab.on{background:#fff;color:var(--ink);border:none;margin:0;font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.gate .g-form .field{margin-bottom:14px}
.gate .g-note{color:var(--muted-2);border-top:1px solid var(--line);margin-top:26px}
.gate .card{border-radius:18px;margin-left:0;margin-right:0}
.prod-ico{border:none;background:var(--paper-2);color:var(--ink-2)}
.meta-cap{color:var(--muted-2)}

/* 编辑资料：头像 / 封面两块 */
.pf-cover{margin-bottom:16px}
.pf-cover-box{display:block;position:relative;cursor:pointer}
.pf-ava{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.pf-ava-box{cursor:pointer;flex:0 0 auto}
.pf-prev{width:74px;height:74px;border-radius:50%;background:var(--paper-2) center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:var(--ink-2);overflow:hidden;border:1px solid var(--line)}
.pf-wide{width:100%;height:96px;border-radius:16px;flex:none;font-size:11px;font-weight:400;color:var(--muted-2)}
.pf-cover-box .pf-cap{position:absolute;right:10px;bottom:10px;background:rgba(255,255,255,.92);padding:5px 11px;border-radius:999px;font-size:11px;margin:0}
.pf-cap{font-size:11.5px;color:var(--ink-2);font-weight:500;margin-bottom:4px}
.pf-id{background:var(--paper-2);border-radius:12px;padding:12px 14px;font-size:13px;letter-spacing:.1em;color:var(--ink-2);font-weight:600}
.g-slogan{font-size:11px;letter-spacing:.24em;color:var(--muted-2);margin:18px 0 0;text-transform:uppercase}

/* ============ V2 首页 / 资源 / 夸夸 ============ */
.v2-hero{padding:6px 2px 20px}
.v2-eyebrow{font-size:9.5px;letter-spacing:.24em;color:var(--muted-2);text-transform:uppercase}
.v2-title{font-size:27px;line-height:1.32;font-weight:800;letter-spacing:-.02em;margin:12px 0 0}
.v2-lede{font-size:12.5px;color:var(--muted);margin:10px 0 0;line-height:1.7}
.v2-days{display:flex;align-items:center;gap:16px;padding:20px 22px;border:1px solid var(--line);border-radius:20px;margin-bottom:22px}
.v2-days-num{font-size:40px;font-weight:800;letter-spacing:-.04em;line-height:1;color:var(--ink)}
.v2-days-t{font-size:12px;color:var(--ink-2);font-weight:600}
.v2-days-s{font-size:10.5px;color:var(--muted-2);margin-top:5px}
.v2-notice{display:flex;gap:8px;align-items:center;padding:12px 16px;border-radius:14px;background:#F7F7F9;font-size:11.5px;color:var(--ink-2);margin-bottom:16px;overflow:hidden}
.v2-notice span{flex:0 0 auto;color:var(--sage);font-weight:700}
.v2-notice b{flex:0 0 auto}
.v2-notice i{font-style:normal;color:var(--muted)}
.v2-entries{display:flex;flex-direction:column;gap:2px;margin-bottom:26px}
.v2-entry{display:flex;align-items:center;gap:10px;padding:15px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.v2-entry-t{font-size:13.5px;font-weight:700;flex:0 0 auto}
.v2-entry-s{font-size:11px;color:var(--muted-2);flex:1 1 auto;text-align:right;margin-right:8px}
.v2-entry svg{width:14px;height:14px;color:var(--muted-2)}
.v2-list{display:flex;flex-direction:column;gap:10px}
.v2-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.v2-thumb{width:46px;height:46px;border-radius:12px;flex:0 0 auto;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700}
.v2-item-main{flex:1 1 auto;min-width:0}
.v2-item-t{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v2-item-s{font-size:10.5px;color:var(--muted-2);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v2-item svg{width:13px;height:13px;color:var(--muted-2);flex:0 0 auto}
.v2-cond{flex:0 0 auto;font-size:9.5px;padding:3px 7px;border-radius:999px;background:var(--sage-soft);color:var(--sage-deep);font-weight:600}
.v2-pill{font-size:9.5px;padding:3px 8px;border-radius:999px;background:#F4F4F6;color:var(--muted)}
.v2-bar{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.v2-search{flex:1 1 auto;display:flex;align-items:center;gap:8px;height:42px;padding:0 16px;border-radius:21px;background:#F5F5F7}
.v2-search svg{width:15px;height:15px;color:var(--muted-2);flex:0 0 auto}
.v2-search input{flex:1 1 auto;border:none;background:none;outline:none;font-size:12.5px;color:var(--ink);font-family:inherit}
.v2-addbtn{width:42px;height:42px;border-radius:50%;border:none;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto}
.v2-addbtn svg{width:17px;height:17px}
.v2-sortline{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;font-size:10.5px;color:var(--muted-2)}
.v2-sorts{display:flex;gap:12px}
.v2-sorts b{font-weight:500;color:var(--muted-2);cursor:pointer}
.v2-sorts b.on{color:var(--ink);font-weight:700}
.v2-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 12px}
.v2-grid-item{cursor:pointer}
.v2-grid-cover{width:100%;aspect-ratio:4/3;border-radius:14px;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;margin-bottom:8px}
.v2-grid-t{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v2-grid-s{font-size:10.5px;color:var(--muted-2);margin-top:3px}
.v2-preview{width:100%;aspect-ratio:4/3;border-radius:18px;background-size:cover;background-position:center;margin-bottom:16px}
.v2-preview-glyph{display:flex;align-items:center;justify-content:center;font-size:54px;font-weight:700}
.v2-desc{font-size:12.5px;line-height:1.85;color:var(--ink-2);margin:0 0 14px;white-space:pre-wrap}
.v2-author{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.v2-author-n{font-size:12px;font-weight:600}
.v2-author-d{font-size:10.5px;color:var(--muted-2);margin-top:2px}
.v2-kvbox{border:1px solid var(--line);border-radius:14px;padding:6px 14px;margin-bottom:14px}
.v2-kvbox .kv{border-bottom:none;padding:8px 0}
.v2-sec{font-size:9.5px;letter-spacing:.18em;color:var(--muted-2);text-transform:uppercase;margin-bottom:8px}
.v2-files{margin-bottom:6px}
.v2-file{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:12px;background:#F7F7F9;font-size:11.5px;color:var(--ink-2);margin-bottom:6px}
.v2-file svg{width:13px;height:13px;color:var(--muted-2)}
.v2-file span{flex:1 1 auto;color:var(--muted-2);font-size:10.5px}
.v2-revoke{border:none;background:none;color:var(--sage-deep);font-size:10.5px;cursor:pointer;font-family:inherit}
.v2-lock{padding:12px 14px;border-radius:12px;background:var(--sage-soft);color:var(--sage-deep);font-size:11.5px;line-height:1.7;margin-bottom:12px}
.v2-rule{display:flex;gap:9px;padding:12px 14px;border-radius:12px;background:#F7F7F9;font-size:11px;line-height:1.7;color:var(--muted);align-items:flex-start}
.v2-rule svg{width:13px;height:13px;flex:0 0 auto;margin-top:2px;color:var(--muted-2)}
.v2-quote{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:14px;margin:12px 0 10px;background:#FBFBFC;cursor:pointer}
.v2-quote-thumb{width:38px;height:38px;border-radius:10px;flex:0 0 auto;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700}
.v2-quote-t{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v2-quote-s{font-size:10.5px;color:var(--muted-2);margin-top:3px}
.v2-praise{padding:18px 0;border-bottom:1px solid var(--line)}
.v2-praise-head{display:flex;align-items:center;gap:10px}
.v2-praise-n{font-size:12px;font-weight:600}
.v2-praise-t{font-size:10px;color:var(--muted-2);margin-top:2px}
.v2-like{margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 10px;font-size:10.5px;color:var(--muted);display:flex;align-items:center;gap:5px;font-family:inherit;cursor:pointer}
.v2-like svg{width:12px;height:12px}
.v2-praise-body{font-size:13px;line-height:1.9;margin:4px 0 0;color:var(--ink)}
.v2-upcover{height:0;overflow:hidden;border-radius:14px;background-size:cover;background-position:center;transition:height .2s;margin-top:10px}
.v2-upcover.on{height:104px}
.v2-foot{text-align:center;font-size:10.5px;color:#C6C6CE;margin:30px 0 6px}

/* ============ V3 视觉收口（更干净的 ins 风） ============ */
:root{
  --ink:#0E0E10;
  --muted:#8C8C93;
  --line:#F0F0F2;
  --soft:#F7F7F8;
}
body,.phone{background:#FFFFFF}
.appbar{height:52px;border-bottom:1px solid var(--line);background:#fff}
.appbar .ab-title{font-size:14px;font-weight:600;letter-spacing:.01em}
.appbar .ab-sub{font-size:9.5px;letter-spacing:.16em;color:#B4B4BB;text-transform:uppercase;margin-top:2px}
.ab-center{display:flex;flex-direction:column;align-items:center;line-height:1}#abAvatar{width:30px;height:30px;font-size:11px;border-radius:50%}
#menuBtn{width:32px;height:32px}.ab-btn{background:none;border:none}
.tabbar{height:calc(var(--tab) + 4px);border-top:1px solid var(--line);background:rgba(255,255,255,.94);backdrop-filter:blur(14px)}
.tabbar a{font-size:9.5px;letter-spacing:.02em;color:#B0B0B7;gap:4px}
.tabbar a.on{color:var(--ink)}
.tabbar a svg{width:19px;height:19px}

/* 首页 */
#view{padding-bottom:18px}
.v2-hero{padding:30px 22px 8px !important;background:#fff !important;border:none !important}
.v2-eyebrow{font-size:9.5px !important;letter-spacing:.26em !important;color:#B9B9C0 !important;margin-bottom:14px !important}
.v2-title{font-size:34px !important;line-height:1.16 !important;font-weight:700 !important;letter-spacing:-.02em !important;color:var(--ink) !important}
.v2-greet{font-size:12.5px !important;color:var(--muted) !important;margin-top:12px !important}
.v2-days{margin:24px 22px 6px !important;padding:22px 0 20px !important;border:none !important;border-top:1px solid var(--line) !important;border-bottom:1px solid var(--line) !important;border-radius:0 !important;background:#fff !important;display:flex;align-items:flex-end;gap:14px}
.v2-days b{font-size:60px !important;line-height:.86 !important;font-weight:600 !important;letter-spacing:-.05em !important}
.v2-days span{font-size:11px !important;line-height:1.7 !important;color:var(--muted) !important}
.v2-entry{margin:8px 22px 0 !important;border-radius:0 !important;background:#fff !important;border:none !important;overflow:visible !important}
.v2-item{padding:18px 0 !important;border-bottom:1px solid var(--line) !important;border-radius:0 !important;background:#fff !important}
.v2-item:last-child{border-bottom:none !important}
.v2-item .t{font-size:14.5px !important;font-weight:500 !important}
.v2-item .s{font-size:11px !important;color:var(--muted) !important;margin-top:3px !important}

/* 分区标题 */
.v2-sec{font-size:10px !important;letter-spacing:.18em !important;text-transform:uppercase !important;color:#A9A9B1 !important;font-weight:500 !important;margin:26px 0 12px !important}

/* 资源库 */
.v2-bar{padding:8px 20px 10px !important;gap:10px !important}
.v2-search{height:40px !important;border-radius:999px !important;background:var(--soft) !important;border:none !important;padding:0 16px !important;font-size:12.5px !important}
.v2-addbtn{width:40px !important;height:40px !important;border-radius:50% !important;background:var(--ink) !important}
.v2-sort{gap:16px !important;font-size:11.5px !important;color:#ADADB4 !important;padding:2px 20px 14px !important}
.v2-sort .on{color:var(--ink) !important;font-weight:600 !important}
.v2-grid{grid-template-columns:1fr 1fr !important;gap:14px 10px !important;padding:0 18px !important}
.v2-grid-cover{aspect-ratio:1/1 !important;border-radius:14px !important;border:none !important}
.v2-grid .n{font-size:12.5px !important;margin-top:7px !important;font-weight:500 !important}
.v2-grid .m{font-size:10px !important;color:var(--muted) !important;margin-top:2px !important}

/* 夸夸 */
.v2-praise{border-radius:18px !important;border:1px solid var(--line) !important;padding:18px 18px 14px !important;background:#fff !important;margin:0 18px 12px !important}
.v2-quote{border-radius:12px !important;background:var(--soft) !important;border:none !important;padding:8px !important}

/* 详情弹层 */
.modal .sheet{border-radius:26px 26px 0 0 !important}
.v2-preview{padding:0 !important}
.v2-preview .ph{height:210px !important;border-radius:0 !important;margin:0 -20px 0 !important}
.v2-kvbox{border-radius:16px !important;background:var(--soft) !important;border:none !important;padding:14px 16px !important}
.v2-file{border-radius:12px !important;background:var(--soft) !important;border:none !important;padding:10px 12px !important;margin-bottom:8px !important}
.v3-stats{display:flex;gap:26px;padding:16px 0 4px;border-bottom:1px solid var(--line);margin-bottom:2px}
.v3-stats span{font-size:11px;color:var(--muted)}
.v3-stats b{font-size:17px;font-weight:600;color:var(--ink);margin-right:4px}
.v3-cmt{margin-top:6px}
.v3-cmt-row{padding:12px 0;border-bottom:1px solid var(--line)}
.v3-cmt-n{font-size:11.5px;font-weight:500;color:var(--ink);display:flex;gap:8px;align-items:baseline}
.v3-cmt-n i{font-style:normal;font-size:9.5px;color:#B8B8BF}
.v3-cmt-t{font-size:13px;line-height:1.85;color:#3A3A40;margin-top:4px}
.v3-cmt-empty{font-size:11.5px;color:#B0B0B7;padding:14px 0}
.v3-cmt-box{display:flex;gap:8px;margin:14px 0 4px;align-items:center}
.v3-cmt-box input{flex:1;height:42px;border-radius:999px;background:var(--soft);border:none;padding:0 16px;font-size:12.5px;font-family:inherit}
.v3-cmt-box button{height:42px;padding:0 20px;border-radius:999px;background:var(--ink);color:#fff;border:none;font-size:12.5px;font-family:inherit}

/* 表单与按钮 */
input,textarea,select{background:var(--soft) !important;border:none !important;border-radius:13px !important}
textarea{border-radius:16px !important}
.btn,.v2-btn{border-radius:999px !important}
.btn-primary,.primary{background:var(--ink) !important}
h1,h2,h3{letter-spacing:-.01em}

/* 其他页面统一收口 */
.card,.box,.panel{border-radius:18px !important;border:1px solid var(--line) !important;box-shadow:none !important}
.aigc-note,#aigcNote{display:none !important}


/* ===== V4 设计稿重做 ===== */
/* ============================================================
   V4 · 按设计稿重做的视觉系统（成员 / 管理员 / 超管）
   底色 #FBFBFA · 墨 #111112 · 灰 #8B8B92 · 线 #EFEFF1
   ============================================================ */
:root{
  --paper:#FBFBFA; --ink:#111112; --ink-2:#3A3A40; --muted:#8B8B92; --muted-2:#AFAFB6;
  --line:#EFEFF1; --surface:#F5F5F6; --accent:#E9405B;
  --tab:58px; --bar:54px;
  --font:"Inter","PingFang SC","Noto Sans SC","Helvetica Neue",Arial,sans-serif;
}
html,body{background:#E9E9EC;}
.phone{background:var(--paper);max-width:430px;font-family:var(--font);-webkit-font-smoothing:antialiased;}
.phone .appbar, .phone .tabbar{background:rgba(251,251,250,.92);backdrop-filter:blur(14px);}

/* ---------- 通用排版 ---------- */
body, p, div, span, a, li{color:var(--ink);}
p.lede, .v2-lede{font-size:13px;line-height:1.8;color:var(--muted);}
.eyebrow, .v2-eyebrow, .s, .k{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted-2);font-weight:500;}
h1,h2,h3,.h1,.h2,.h3,.c-title{font-weight:600;letter-spacing:-.025em;color:var(--ink);}
.h1{font-size:33px;line-height:1.22;}
.h2{font-size:17px;letter-spacing:-.015em;}
.h3{font-size:13.5px;letter-spacing:.02em;}
.small,hint,.hint{font-size:11px;line-height:1.7;color:var(--muted);}

/* ---------- 顶栏 ---------- */
.appbar{height:var(--bar);border-bottom:0;padding:0 14px;}
.appbar .ab-title, .ab-title{font-size:11px;letter-spacing:.28em;font-weight:600;}
.appbar .ab-sub, .ab-sub{font-size:9px;letter-spacing:.18em;color:var(--muted-2);}
.icon-btn, .ab-avatar{width:34px;height:34px;border-radius:999px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;}

/* ---------- 底栏 ---------- */
.tabbar{height:var(--tab);border-top:1px solid var(--line);background:#fff;}
.tabbar .tab{font-size:10px;letter-spacing:.08em;color:var(--muted-2);}
.tabbar .tab.on{color:var(--ink);}

/* ---------- 容器 ---------- */
.main, #view{padding:0 22px 26px;}
.sec{margin-top:22px;}
.rule{height:1px;background:var(--line);border:0;margin:18px 0;}

/* ---------- 按钮 ---------- */
.btn{border-radius:999px;height:44px;padding:0 22px;font-size:13px;font-weight:500;border:1px solid var(--line);background:#fff;color:var(--ink);letter-spacing:.01em;}
.btn--ink{background:var(--ink);color:#fff;border-color:var(--ink);}
.btn--ghost{background:#fff;color:var(--ink);border-color:var(--line);}
.btn--sm{height:32px;padding:0 14px;font-size:11.5px;border-radius:999px;}
.btn--danger{background:#fff;border-color:#F0D6DA;color:var(--accent);}
.btn--block,.btn-block{width:100%;}
.chip{border-radius:999px;height:30px;padding:0 14px;font-size:11px;border:1px solid var(--line);background:#fff;color:var(--muted);display:inline-flex;align-items:center;}
.chip.active,.chip.on{background:var(--ink);color:#fff;border-color:var(--ink);}

/* ---------- 卡片 ---------- */
.card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:none;}
.card.pad{padding:16px 18px;}
.arow{border-bottom:1px solid var(--line);padding:14px 0;}

/* ---------- 首页 ---------- */
.v2-hero{padding-top:18px;}
.v2-eyebrow{margin-bottom:14px;}
.v2-hero .h1{font-size:33px;line-height:1.24;margin:0;}
.v2-greet,.v2-desc{color:var(--muted);}
.v2-days{margin-top:24px;border-top:1px solid var(--line);padding-top:16px;}
.v2-days-num{font-size:50px;font-weight:600;letter-spacing:-.04em;line-height:1;}
.v2-days-t{font-size:11px;color:var(--muted);}
.v2-days-s{font-size:10px;color:var(--muted-2);letter-spacing:.06em;}
.v2-entries{margin-top:10px;}
.v2-entry{padding:16px 0;border-bottom:1px solid var(--line);}
.v2-entry-t{font-size:13.5px;font-weight:500;}
.v2-entry-s{font-size:11px;color:var(--muted);margin-top:3px;}
.v2-entry .arw, .v2-entry i{color:var(--muted-2);}
.v2-notice{background:var(--surface);border-radius:14px;padding:12px 14px;font-size:11px;color:var(--muted);}
.v2-foot{margin-top:26px;border-top:1px solid var(--line);padding-top:14px;}

/* ---------- 资源库 ---------- */
.v2-bar{display:flex;gap:10px;align-items:center;margin:14px 0 4px;}
.v2-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px;margin-top:14px;}
.v2-grid-item{border:0;background:transparent;}
.v2-grid-cover{border-radius:14px;overflow:hidden;aspect-ratio:1/1.02;}
.v2-grid-t{font-size:12px;font-weight:500;margin-top:8px;}
.v2-grid-s{font-size:9.5px;color:var(--muted-2);margin-top:2px;letter-spacing:.04em;}
.v2-addbtn{background:var(--ink);color:#fff;border-radius:999px;}

/* ---------- 资源详情弹层 ---------- */
.v2-preview{border-radius:14px;overflow:hidden;}
.v2-author-n{font-size:12.5px;font-weight:500;}
.v2-author-d{font-size:10px;color:var(--muted-2);}
.v2-kvbox{background:var(--surface);border-radius:14px;padding:14px 16px;}
.v2-kvbox .kv, .kv{border-bottom:1px solid var(--line);padding:9px 0;font-size:11.5px;}
.v2-kvbox .kv:last-child{border-bottom:0;}
.v2-cond{border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:10px;color:var(--muted);}
.v2-like{height:44px;border-radius:999px;}
.v2-praise{border-top:1px solid var(--line);}

/* ---------- 我的（个人主页） ---------- */
.zc-cover{height:124px;background:linear-gradient(135deg,#DCD5C8,#B7AEA0 60%,#8E857A);position:relative;}
.zc-cover .zc-cover-btn{position:absolute;top:10px;right:16px;font-size:9px;letter-spacing:.12em;color:rgba(255,255,255,.9);border:1px solid rgba(255,255,255,.36);border-radius:999px;padding:4px 10px;background:rgba(0,0,0,.12);}
.zc-cover--dark{background:linear-gradient(135deg,#3A3A40,#1A1A1E 70%,#0B0B0C);}
.zc-me{padding:0 22px;}
.zc-me-head{display:flex;align-items:flex-end;gap:12px;margin-top:-30px;}
.zc-av{width:64px;height:64px;border-radius:999px;border:3px solid var(--paper);background:var(--surface);color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:600;overflow:hidden;}
.zc-av img{width:100%;height:100%;object-fit:cover;}
.zc-name{font-size:16px;font-weight:600;letter-spacing:-.01em;}
.zc-badge{display:inline-flex;align-items:center;margin-top:5px;font-size:8.5px;letter-spacing:.14em;border-radius:999px;padding:3px 9px;}
.zc-badge--member{color:var(--muted);background:#fff;border:1px solid var(--line);}
.zc-badge--admin{color:#fff;background:var(--ink);border:1px solid var(--ink);}
.zc-badge--super{color:#fff;background:var(--ink);border:1px solid var(--ink);letter-spacing:.1em;}
.zc-sub{font-size:10px;color:var(--muted-2);margin-top:10px;letter-spacing:.02em;}
.zc-id{display:flex;align-items:center;gap:8px;margin-top:9px;}
.zc-id span.pill{border:1px solid var(--line);border-radius:999px;padding:3px 9px;font-size:9px;letter-spacing:.1em;color:var(--muted);background:#fff;}
.zc-id i{font-style:normal;font-size:8.5px;color:var(--muted-2);}
.zc-stats{display:flex;gap:22px;margin-top:15px;padding-bottom:14px;border-bottom:1px solid var(--line);}
.zc-stats .n{font-size:16px;font-weight:600;letter-spacing:-.02em;}
.zc-stats .l{font-size:8.5px;color:var(--muted-2);margin-top:2px;letter-spacing:.06em;}
.zc-console-card{margin-top:14px;border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;background:#fff;}
.zc-console-card--dark{background:var(--ink);border-color:var(--ink);}
.zc-console-card--dark .t{color:#fff;}
.zc-console-card--dark .s{color:rgba(255,255,255,.55);}
.zc-console-card .t{font-size:11.5px;font-weight:500;}
.zc-console-card .s{font-size:8.5px;color:var(--muted-2);margin-top:2px;}
.zc-console-card .go{font-size:9px;border-radius:999px;padding:6px 12px;background:var(--ink);color:#fff;}
.zc-console-card--dark .go{background:#fff;color:var(--ink);}
.zc-row{display:flex;align-items:center;justify-content:space-between;padding:15px 0;border-bottom:1px solid var(--line);font-size:12.5px;}
.zc-row:last-child{border-bottom:0;}
.zc-row .r{color:var(--muted-2);font-size:11px;}
.zc-row small{font-size:9px;color:var(--muted-2);margin-left:6px;letter-spacing:.04em;}
.zc-note{font-size:8.5px;color:var(--muted-2);line-height:1.9;margin-top:8px;}
.zc-signout{margin:22px 0 6px;text-align:center;font-size:11px;color:var(--muted-2);letter-spacing:.1em;}

/* ---------- 控制台 ---------- */
.c-dark{background:var(--ink);color:#fff;margin:0 -22px;padding:22px 22px 20px;}
.c-dark .eyebrow{color:rgba(255,255,255,.42);}
.c-dark .c-title{color:#fff;font-size:22px;margin-top:6px;}
.c-dark .c-sub{color:rgba(255,255,255,.5);font-size:10.5px;line-height:1.75;margin-top:6px;}
.c-dark .c-back{display:inline-flex;align-items:center;gap:5px;margin-top:12px;font-size:9px;letter-spacing:.1em;color:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.24);border-radius:999px;padding:5px 11px;background:transparent;}

.admin-tabs::-webkit-scrollbar{display:none;}
.atab{flex:0 0 auto;border-radius:999px;padding:7px 13px;font-size:11px;color:var(--muted);border:1px solid var(--line);background:#fff;white-space:nowrap;}
.atab.active{background:var(--ink);color:#fff;border-color:var(--ink);}
.atab b{margin-left:4px;font-weight:500;color:var(--accent);}
.atab.active b{color:#fff;}

.pane-head .h2{font-size:17px;margin-top:3px;}
.pane-head .pill{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:9.5px;color:var(--muted);}
.blank{border:1px dashed var(--line);border-radius:16px;padding:34px 20px;text-align:center;color:var(--muted-2);font-size:11.5px;}

/* 聊天 */
.v2-chat-b{padding:10px 13px;border-radius:14px;font-size:12px;line-height:1.7;}
.chat-mode .main{padding:0 18px;}

/* 登录 / 入场（gate） */
.gate{background:var(--paper);padding:26px 26px 30px;}
.g-mark{width:44px;height:44px;border-radius:999px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;}

.gate .lede{color:var(--muted);font-size:12.5px;line-height:1.8;}
.gate .input,.input{height:46px;border:1px solid var(--line);border-radius:14px;background:#fff;font-size:13px;padding:0 14px;width:100%;}
.gate .label,.label{font-size:9.5px;letter-spacing:.18em;color:var(--muted-2);text-transform:uppercase;margin-bottom:7px;}
.gate .btn{height:48px;}
.gate .seg{border-radius:999px;}

/* 弹层 */
.modal-panel, .sheet{border-radius:22px;}
.modal-panel .h2{font-size:18px;}

/* 去掉旧的卡片盒子，回到设计稿的「整页 + 细线」 */
.v2-hero, .v2-entries, .v2-entry, .v2-list, .v2-item, .v2-praise, .sec, .zone{
  background:transparent!important; box-shadow:none!important; border-radius:0!important;

.v2-days-t{font-size:12px!important;color:var(--ink)!important;}
.v2-days-s{font-size:10px!important;color:var(--muted-2)!important;margin-top:3px;}
.v2-days-wrap,.v2-days-r{display:flex;flex-direction:column;justify-content:center;}
#view{background:var(--paper);}
.phone{background:var(--paper)!important;}

.zc-row{padding:12px 0!important;line-height:1.4;}

.v2-entry .v2-entry-t{font-size:13.5px;line-height:1.4;}

.c-metrics .n{line-height:1.15!important;}

#view{padding-bottom:34px!important;}
