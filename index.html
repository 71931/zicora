    try { if (s) localStorage.setItem(SESS_KEY, JSON.stringify(s)); else localStorage.removeItem(SESS_KEY); } catch (e) {}
  }

  /* ---------- HTTP ---------- */
  async function http(path, opt) {
    opt = opt || {};
    const headers = Object.assign(
      { apikey: SB_KEY, 'Content-Type': 'application/json' },
      { Authorization: 'Bearer ' + ((session && session.access_token) || SB_KEY) },
      opt.headers || {}
    );
    const init = { method: opt.method || 'GET', headers: headers };
    if (opt.body !== undefined) init.body = typeof opt.body === 'string' ? opt.body : JSON.stringify(opt.body);
    let res;
    try { res = await fetch(SB_URL + path, init); }
    catch (e) { const err = new Error('连不上服务器，请检查网络'); err.network = true; throw err; }
    if (res.status === 401 && session && session.refresh_token && !opt._retried) {
      try { await doRefresh(); return http(path, Object.assign({}, opt, { _retried: true })); } catch (e) {}
    }
    const text = await res.text();
    let data = null;
    try { data = text ? JSON.parse(text) : null; } catch (e) { data = text; }
    if (!res.ok) {
      const msg = (data && (data.message || data.msg || data.error_description || data.hint)) || ('请求失败（' + res.status + '）');
      const err = new Error(msg); err.status = res.status; err.data = data;
      throw err;
    }
    return data;
  }
  const rpc = (fn, args) => http('/rest/v1/rpc/' + fn, { method: 'POST', body: args || {} });

  async function signUp(email, pass) {
    const d = await http('/auth/v1/signup', { method: 'POST', body: { email: email, password: pass }, headers: { Authorization: 'Bearer ' + SB_KEY } });
    if (!d || !d.access_token) throw new Error('注册成功但没有登录状态：需要在 Supabase 里关闭 Confirm email');
    saveSession({ access_token: d.access_token, refresh_token: d.refresh_token, user: d.user });
    rememberEmail(email);
    return d;
  }
  async function signIn(email, pass) {
    const d = await http('/auth/v1/token?grant_type=password', { method: 'POST', body: { email: email, password: pass } });
    saveSession({ access_token: d.access_token, refresh_token: d.refresh_token, user: d.user });
    rememberEmail(email);
    return d;
  }
  function rememberEmail(email) {
    try { if (email) localStorage.setItem(LAST_EMAIL_KEY, String(email).trim()); } catch (e) {}
  }
  function lastEmail() {
    try { return localStorage.getItem(LAST_EMAIL_KEY) || ''; } catch (e) { return ''; }
  }
  /* access_token 里的 exp（秒）。解析失败就当没过期，交给 401 兜底 */
  function tokenExp(t) {
    try {
      const p = String(t || '').split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
      const s = JSON.parse(decodeURIComponent(escape(atob(p))));
      return (s && s.exp) ? s.exp * 1000 : 0;
    } catch (e) { return 0; }
  }
  async function doRefresh() {
    if (!session || !session.refresh_token) throw new Error('登录状态已失效，请重新登录');
    const d = await http('/auth/v1/token?grant_type=refresh_token', { method: 'POST', body: { refresh_token: session.refresh_token }, _retried: true });
    saveSession({ access_token: d.access_token, refresh_token: d.refresh_token, user: d.user || session.user });
  }
  async function signOut() {
    try { if (session) await http('/auth/v1/logout', { method: 'POST' }); } catch (e) {}
    saveSession(null);
  }

  /* ---------- 库表 → 界面结构 ---------- */
  function profileFrom(r) {
    return {
      _db: r.id, id: r.id, name: r.name, handle: r.handle || '', role: r.role, bio: r.bio || '',
      avatar: /^https?:/i.test(r.avatar || '') ? '' : ((r.avatar && /^\d{3,}$/.test(r.avatar)) ? '' : (r.avatar || '')),
      avatarImg: /^https?:/i.test(r.avatar || '') ? r.avatar : '',
      banner: r.banner || '', color: r.color || 0, banned: !!r.banned, joined: r.joined_at,
      invite: r.invite_code || '', applyReason: r.apply_reason || '', prefs: prefsOf(r.id)
    };
  }
  function profileRow(u) {
    return { name: u.name, handle: u.handle || null, role: u.role, bio: u.bio || '', avatar: (u.avatarImg || u.avatar || null), color: u.color || 0, banned: !!u.banned, apply_reason: u.applyReason || '' };
  }
  function resourceFrom(r, likes, books) {
    return {
      _db: r.id, id: 'r' + r.id, name: r.name, cat: r.category, authorId: r.author,
      version: r.version || '1.0', desc: r.summary || '', date: r.created_at,
      downloads: r.downloads || 0, likes: likes || 0, status: r.status,
      license: r.license || '', external: r.external_url || '', glyph: r.glyph || '',
      tone: r.tone || 0, files: Array.isArray(r.files) ? r.files : [],
      cover: r.cover || '', needLike: !!r.need_like, needComment: !!r.need_comment, hash: r.hash || '',
      bookmarkedBy: books || [], reviewNote: r.review_note || '', likedBy: []
    };
  }
  function resourceRow(x, meId) {
    const row = {
      name: x.name, category: x.cat, version: x.version || '1.0', summary: x.desc || '',
      status: x.status, license: x.license || '', external_url: x.external || null,
      files: x.files || [], glyph: x.glyph || null, tone: x.tone || 0, downloads: x.downloads || 0
    };
    if (meId) row.author = meId;
    return row;
  }
  function praiseFrom(p, likes, cmts) {
    return {
      _db: p.id, id: 'p' + p.id, type: p.type, text: p.body || '',
      targetId: p.target_id || '', targetName: p.target_label || '',
      authorId: p.author, date: p.created_at, likedBy: likes || [], comments: cmts || []
    };
  }
  function praiseRow(x, meId) {
    const row = { type: x.type, body: x.text || '', target_label: x.targetName || null, target_id: x.targetId || null };
    if (meId) row.author = meId;
    return row;
  }
  function chatFrom(m) {
    const attach = m.image_url ? { type: 'image', url: m.image_url }
      : (m.file_url || m.file_name ? { type: 'file', name: m.file_name || '文件', url: m.file_url || '' } : null);
    return {
      _db: m.id, id: 'm' + m.id, _ch: m.channel_id, userId: m.author, text: m.body || '',
      date: m.created_at, replyTo: m.reply_to ? 'm' + m.reply_to : null, attach: attach
    };
  }
  function chatRow(x, meId) {
    const a = x.attach || null;
    const row = {
      channel_id: x._ch, body: x.text || '',
      image_url: a && a.type === 'image' ? a.url : null,
      file_url: a && a.type === 'file' ? (a.url || null) : null,
      file_name: a && a.type === 'file' ? (a.name || null) : null,
      reply_to: x.replyTo ? Number(String(x.replyTo).replace(/^\D+/g, '')) : null
    };
    if (meId) row.author = meId;
    return row;
  }
  function bugFrom(b, replies) {
    return {
      _db: b.id, id: 'b' + b.id, userId: b.author, device: b.device, mode: b.mode, version: b.version,
      browser: b.browser, page: b.page, detail: b.detail, steps: b.steps, expect: b.expect,
      attach: Array.isArray(b.attachments) ? b.attachments : [], status: b.status,
      date: b.created_at, replies: replies || []
    };
  }
  function bugRow(x, meId) {
    const row = {
      device: x.device, mode: x.mode, version: x.version, browser: x.browser, page: x.page,
      detail: x.detail, steps: x.steps, expect: x.expect,
      attachments: x.attach || [], status: x.status
    };
    if (meId) row.author = meId;
    return row;
  }

  /* ---------- 同步快照 ---------- */
  let snap = {};
  const J = (o) => JSON.stringify(o);

  const Store = {
    data: emptyData(),
    hydrated: false,
    loadError: '',
    status: { hasAdmin: true, loaded: false, members: 0 },
    onChange: null,

    async init() {
      this.data = emptyData();
      this.data.session = { userId: session ? session.user.id : null };
      if (session) {
        // 上次的登录状态还在：先续一次令牌再拉数据，避免每次打开都要重输账号
        try {
          if (!session.access_token || (tokenExp(session.access_token) && Date.now() > tokenExp(session.access_token) - 180000)) {
            await doRefresh();
          }
        } catch (e) { console.warn('续期失败', e); }
        await this.hydrate();
      } else {
        try { await this.loadStatus(); } catch (e) {}
      }
      this.hydrated = true;
      this.emit();
      return this.data;
    },
    emit() { if (typeof this.onChange === 'function') { try { this.onChange(); } catch (e) { console.warn(e); } } },

    async loadStatus() {
      try {
        const r = await rpc('site_status', {});
        this.status = { hasAdmin: !!r.has_admin, loaded: true, members: r.members || 0 };
      } catch (e) {
        // 未安装 site_status 时退化成登录页，避免把老成员挡在「建站」页
        this.status = { hasAdmin: true, loaded: false, members: 0 };
      }
      return this.status;
    },

    async hydrate() {
      this.loadError = '';
      let raw;
      try {
        raw = await Promise.all([
          http('/rest/v1/profiles?select=*'),
          http('/rest/v1/channels?select=*&order=sort_order.asc'),
          http('/rest/v1/resources?select=*&order=created_at.desc'),
          http('/rest/v1/praise?select=*&order=created_at.desc'),
          http('/rest/v1/praise_likes?select=*'),
          http('/rest/v1/praise_comments?select=*&order=created_at.asc'),
          http('/rest/v1/resource_likes?select=*'),
          http('/rest/v1/resource_bookmarks?select=*'),
          http('/rest/v1/chats?select=*&order=created_at.asc'),
          http('/rest/v1/bugs?select=*&order=created_at.desc'),
          http('/rest/v1/bug_replies?select=*&order=created_at.asc'),
          http('/rest/v1/invites?select=*&order=created_at.desc'),
          http('/rest/v1/announcements?select=*&order=created_at.desc'),
          http('/rest/v1/site_config?select=*&limit=1'),
          http('/rest/v1/applications?select=*&order=id.desc'),
          http('/rest/v1/reports?select=*&order=created_at.desc').catch(() => [])
        ]);
      } catch (e) {
        // 令牌过期不等于没登录：先换一次令牌再重试，只有确实失效才退回登录页
        if ((e.status === 401 || e.status === 403) && session && session.refresh_token) {
          try { await doRefresh(); return this.hydrate(); } catch (e2) {}
        }
        this.loadError = e.status === 401 || e.status === 403 ? '' : (e.message || '加载失败');
        if (e.status === 401 || e.status === 403) { saveSession(null); this.data.session = { userId: null }; }
        return this.data;
      }
      const prof = raw[0], chan = raw[1], res = raw[2], pra = raw[3], plike = raw[4], pcom = raw[5],
        rlike = raw[6], rbook = raw[7], chat = raw[8], bug = raw[9], brep = raw[10], inv = raw[11], ann = raw[12], cfg = raw[13], apps = raw[14], rep = raw[15];

      const likeUsers = {};
      (plike || []).forEach((x) => { (likeUsers[x.praise_id] = likeUsers[x.praise_id] || []).push(x.user_id); });
      const rlikeCount = {}, rlikeUsers = {};
      (rlike || []).forEach((x) => { rlikeCount[x.resource_id] = (rlikeCount[x.resource_id] || 0) + 1; (rlikeUsers[x.resource_id] = rlikeUsers[x.resource_id] || []).push(x.user_id); });
      const bookUsers = {};
      (rbook || []).forEach((x) => { (bookUsers[x.resource_id] = bookUsers[x.resource_id] || []).push(x.user_id); });
      const pcomBy = {}, brepBy = {};
      (pcom || []).forEach((c) => { (pcomBy[c.praise_id] = pcomBy[c.praise_id] || []).push({ _db: c.id, by: c.author, byName: '', text: c.body, date: c.created_at }); });
      (brep || []).forEach((c) => { (brepBy[c.bug_id] = brepBy[c.bug_id] || []).push({ _db: c.id, by: c.author, byName: '', text: c.body, date: c.created_at }); });

      const d = emptyData();
      d.users = (prof || []).map(profileFrom);
      const nameOf = (id) => { const u = d.users.find((x) => x.id === id); return u ? u.name : ''; };
      d.channels = (chan || []).map((c) => ({ _db: c.id, id: c.id, name: c.name, desc: c.description || '', order: c.sort_order || 0, enabled: c.enabled !== false }));
      d.resources = (res || []).map((r) => resourceFrom(r, rlikeCount[r.id], bookUsers[r.id]));
      d.resources.forEach((r) => { r.likedBy = rlikeUsers[r._db] || []; });
      d.praise = (pra || []).map((p) => {
        const item = praiseFrom(p, likeUsers[p.id], pcomBy[p.id]);
        (item.comments || []).forEach((c) => { c.byName = nameOf(c.by); });
        return item;
      });
      d.bugs = (bug || []).map((b) => {
        const item = bugFrom(b, brepBy[b.id]);
        (item.replies || []).forEach((c) => { c.byName = nameOf(c.by); });
        return item;
      });
      d.invites = (inv || []).map((i) => ({ _db: i.code, code: i.code, status: i.status, note: i.note || '', createdBy: i.created_by || '', createdAt: i.created_at, usedBy: i.used_by || '', usedAt: i.used_at || null }));
      d.announcements = (ann || []).map((a) => ({ _db: a.id, id: 'a' + a.id, title: a.title, body: a.body || '', pinned: !!a.pinned, date: a.created_at, author: nameOf(a.author) || '管理员' }));
      d.apps = (apps || []).map((a) => ({
        id: a.id, kind: a.kind, user_id: a.user_id, name: a.name, reason: a.reason || '',
        evidence: a.evidence || {}, status: a.status, code: a.invite_code || '',
        note: a.note || '', date: a.created_at, by: a.reviewed_by || '', at: a.reviewed_at || null
      }));
      d.reports = (rep || []).map((x) => ({
        id: 'rp' + x.id, _db: x.id, kind: x.kind || 'res', targetId: String(x.target_id || ''),
        targetLabel: x.target_label || '', reason: x.reason || '', note: x.note || '',
        reporter: x.reporter || '', status: x.status || 'open', date: x.created_at
      }));
      const c0 = (cfg || [])[0];
      if (c0) {
        d.config = {
          apkUrl: c0.apk_url || '', apkVersion: c0.apk_version || '', apkSize: c0.apk_size || '',
          apkUpdated: c0.apk_updated || '', webUrl: c0.web_url || '', webNote: c0.web_note || '',
          changelog: Array.isArray(c0.changelog) ? c0.changelog : []
        };
      }
      d.chats = {};
      d.channels.forEach((c) => { d.chats[c.id] = []; });
      (chat || []).forEach((m) => {
        const item = chatFrom(m);
        if (!d.chats[item._ch]) d.chats[item._ch] = [];
        d.chats[item._ch].push(item);
      });
      d.session = { userId: session ? session.user.id : null };
      this.data = d;
      this.hydrated = true;
      this.rebuildSnap();
      try { await this.loadStatus(); } catch (e) {}
      this.emit();
      return this.data;
    },

    rebuildSnap() {
      const d = this.data;
      snap = { profiles: {}, resources: {}, praise: {}, chats: {}, bugs: {}, invites: {}, announcements: {}, config: '', likes: {}, books: {}, pcom: {}, brep: {} };
      d.users.forEach((u) => { snap.profiles[u.id] = J(profileRow(u)); });
      d.resources.forEach((r) => {
        snap.resources[r._db] = J(resourceRow(r));
        (r.bookmarkedBy || []).forEach((b) => { snap.books[r._db + '|' + b] = 1; });
      });
      d.praise.forEach((p) => {
        snap.praise[p._db] = J(praiseRow(p));
        (p.likedBy || []).forEach((b) => { snap.likes[p._db + '|' + b] = 1; });
        (p.comments || []).forEach((c) => { if (c._db) snap.pcom[c._db] = 1; });
      });
      Object.keys(d.chats).forEach((ch) => { d.chats[ch].forEach((m) => { if (m._db) snap.chats[m._db] = J(chatRow(m)); }); });
      d.bugs.forEach((b) => {
        snap.bugs[b._db] = J(bugRow(b));
        (b.replies || []).forEach((c) => { if (c._db) snap.brep[c._db] = 1; });
      });
      d.invites.forEach((i) => { snap.invites[i.code] = J({ status: i.status, note: i.note, usedBy: i.usedBy || null }); });
      d.announcements.forEach((a) => { snap.announcements[a._db] = J({ title: a.title, body: a.body, pinned: !!a.pinned }); });
      snap.config = J(d.config);
    },

    /* ---------- 写：把变更推给服务器 ---------- */
    save() {
      if (!this.hydrated) return;
      if (!session) return;
      const self = this;
      if (this._syncTimer) clearTimeout(this._syncTimer);
      this._syncTimer = setTimeout(() => { self.syncNow(); }, 90);
    },
    resetAll() { this.data = emptyData(); this.emit(); },

    async syncNow() {
      if (!session) return;
      const meId = session.user.id;
      const d = this.data;
      const ops = [];
      const push = (op) => ops.push(op);
      const pref = (v) => ({ Prefer: v });

      /* 资料 */
      d.users.forEach((u) => {
        const row = J(profileRow(u));
        if (snap.profiles[u.id] && snap.profiles[u.id] !== row) {
          push(http('/rest/v1/profiles?id=eq.' + u.id, { method: 'PATCH', body: profileRow(u), headers: pref('return=minimal') }));
          snap.profiles[u.id] = row;
        }
      });

      /* 资源 */
      d.resources.forEach((r) => {
        if (!r._db) {
          push(http('/rest/v1/resources', { method: 'POST', body: resourceRow(r, meId), headers: pref('return=representation') })
            .then((res) => { if (res && res[0]) { r._db = res[0].id; r.id = 'r' + res[0].id; snap.resources[r._db] = J(resourceRow(r)); } }));
        } else if (snap.resources[r._db] !== J(resourceRow(r))) {
          push(http('/rest/v1/resources?id=eq.' + r._db, { method: 'PATCH', body: resourceRow(r), headers: pref('return=minimal') }));
          snap.resources[r._db] = J(resourceRow(r));
        }
        (r.bookmarkedBy || []).forEach((b) => {
          const key = r._db + '|' + b;
          if (r._db && !snap.books[key]) {
            push(http('/rest/v1/resource_bookmarks', { method: 'POST', body: { user_id: b, resource_id: Number(r._db) }, headers: pref('return=minimal') }));
            snap.books[key] = 1;
          }
        });
        Object.keys(snap.books).forEach((key) => {
          const parts = key.split('|');
          if (r._db && parts[0] === String(r._db) && (r.bookmarkedBy || []).indexOf(parts[1]) < 0) {
            push(http('/rest/v1/resource_bookmarks?user_id=eq.' + parts[1] + '&resource_id=eq.' + r._db, { method: 'DELETE', headers: pref('return=minimal') }));
            delete snap.books[key];
          }
        });
      });
      Object.keys(snap.resources).forEach((id) => {
        if (!d.resources.some((r) => String(r._db) === String(id))) {
          push(http('/rest/v1/resources?id=eq.' + id, { method: 'DELETE', headers: pref('return=minimal') }));
          delete snap.resources[id];
        }
      });

      /* 夸夸 · 赞 · 评论 */
      d.praise.forEach((p) => {
        if (!p._db) {
          push(http('/rest/v1/praise', { method: 'POST', body: praiseRow(p, meId), headers: pref('return=representation') })
            .then((res) => { if (res && res[0]) { p._db = res[0].id; p.id = 'p' + res[0].id; snap.praise[p._db] = J(praiseRow(p)); } }));
        } else if (snap.praise[p._db] !== J(praiseRow(p))) {
          push(http('/rest/v1/praise?id=eq.' + p._db, { method: 'PATCH', body: praiseRow(p), headers: pref('return=minimal') }));
          snap.praise[p._db] = J(praiseRow(p));
        }
        (p.comments || []).forEach((c) => {
          if (!c._db && p._db) {
            push(http('/rest/v1/praise_comments', { method: 'POST', body: { praise_id: Number(p._db), author: c.by || meId, body: c.text }, headers: pref('return=representation') })
              .then((res) => { if (res && res[0]) c._db = res[0].id; }));
          }
        });
        (p.likedBy || []).forEach((u) => {
          const key = p._db + '|' + u;
          if (p._db && !snap.likes[key]) {
            push(http('/rest/v1/praise_likes', { method: 'POST', body: { user_id: u, praise_id: Number(p._db) }, headers: pref('return=minimal') }));
            snap.likes[key] = 1;
          }
        });
        Object.keys(snap.likes).forEach((key) => {
          const parts = key.split('|');
          if (p._db && parts[0] === String(p._db) && (p.likedBy || []).indexOf(parts[1]) < 0) {
            push(http('/rest/v1/praise_likes?user_id=eq.' + parts[1] + '&praise_id=eq.' + p._db, { method: 'DELETE', headers: pref('return=minimal') }));
            delete snap.likes[key];
          }
        });
      });
      Object.keys(snap.praise).forEach((id) => {
        if (!d.praise.some((p) => String(p._db) === String(id))) {
          push(http('/rest/v1/praise?id=eq.' + id, { method: 'DELETE', headers: pref('return=minimal') }));
          delete snap.praise[id];
        }
      });

      /* 聊天 */
      Object.keys(d.chats).forEach((ch) => {
        d.chats[ch].forEach((m) => {
          if (!m._db) {
            push(http('/rest/v1/chats', { method: 'POST', body: chatRow(m, meId), headers: pref('return=representation') })
              .then((res) => { if (res && res[0]) { m._db = res[0].id; m.id = 'm' + res[0].id; snap.chats[m._db] = J(chatRow(m)); } }));
          } else if (snap.chats[m._db] !== J(chatRow(m))) {
            push(http('/rest/v1/chats?id=eq.' + m._db, { method: 'PATCH', body: chatRow(m), headers: pref('return=minimal') }));
            snap.chats[m._db] = J(chatRow(m));
          }
        });
      });

      /* BUG */
      d.bugs.forEach((b) => {
        if (!b._db) {
          push(http('/rest/v1/bugs', { method: 'POST', body: bugRow(b, meId), headers: pref('return=representation') })
            .then((res) => { if (res && res[0]) { b._db = res[0].id; b.id = 'b' + res[0].id; snap.bugs[b._db] = J(bugRow(b)); } }));
        } else if (snap.bugs[b._db] !== J(bugRow(b))) {
          push(http('/rest/v1/bugs?id=eq.' + b._db, { method: 'PATCH', body: bugRow(b), headers: pref('return=minimal') }));
          snap.bugs[b._db] = J(bugRow(b));
        }
        (b.replies || []).forEach((c) => {
          if (!c._db && b._db) {
            push(http('/rest/v1/bug_replies', { method: 'POST', body: { bug_id: Number(b._db), author: c.by || meId, body: c.text }, headers: pref('return=representation') })
              .then((res) => { if (res && res[0]) c._db = res[0].id; }));
          }
        });
      });

      /* 邀请码 */
      d.invites.forEach((i) => {
        const row = J({ status: i.status, note: i.note, usedBy: i.usedBy || null });
        if (!snap.invites[i.code]) {
          push(http('/rest/v1/invites', { method: 'POST', body: { code: i.code, status: i.status || 'unused', note: i.note || '', created_by: meId }, headers: pref('return=minimal') })
            .then(() => { snap.invites[i.code] = row; }));
        } else if (snap.invites[i.code] !== row) {
          push(http('/rest/v1/invites?code=eq.' + encodeURIComponent(i.code), { method: 'PATCH', body: { status: i.status, note: i.note }, headers: pref('return=minimal') }));
          snap.invites[i.code] = row;
        }
      });

      /* 公告 */
      d.announcements.forEach((a) => {
        const row = J({ title: a.title, body: a.body, pinned: !!a.pinned });
        if (!a._db) {
          push(http('/rest/v1/announcements', { method: 'POST', body: { title: a.title, body: a.body, pinned: !!a.pinned, author: meId }, headers: pref('return=representation') })
            .then((res) => { if (res && res[0]) { a._db = res[0].id; a.id = 'a' + res[0].id; snap.announcements[a._db] = row; } }));
        } else if (snap.announcements[a._db] !== row) {
          push(http('/rest/v1/announcements?id=eq.' + a._db, { method: 'PATCH', body: { title: a.title, body: a.body, pinned: !!a.pinned }, headers: pref('return=minimal') }));
          snap.announcements[a._db] = row;
        }
      });
      Object.keys(snap.announcements).forEach((id) => {
        if (!d.announcements.some((a) => String(a._db) === String(id))) {
          push(http('/rest/v1/announcements?id=eq.' + id, { method: 'DELETE', headers: pref('return=minimal') }));
          delete snap.announcements[id];
        }
      });

      /* 站点配置 */
      if (snap.config !== J(d.config)) {
        push(http('/rest/v1/site_config?id=eq.1', {
          method: 'PATCH',
          body: {
            apk_url: d.config.apkUrl || '', apk_version: d.config.apkVersion || '', apk_size: d.config.apkSize || '',
            apk_updated: d.config.apkUpdated || null, web_url: d.config.webUrl || '',
            web_note: d.config.webNote || '', changelog: d.config.changelog || []
          },
          headers: pref('return=minimal')
        }));
        snap.config = J(d.config);

      if (!ops.length) return;
      const results = await Promise.allSettled(ops);
      const bad = results.filter((r) => r.status === 'rejected');
      if (bad.length) {
        const msg = (bad[0].reason && bad[0].reason.message) || '写入失败';

    /* ---------- 截图上传（私有桶 evidence-proof） ---------- */
    async uploadProof(file) {
      const uidv = session && session.user && session.user.id;
      if (!uidv) throw new Error('请先登录');
      const ext = ((file.name || '').split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '') || 'jpg';
      const path = uidv + '/' + Date.now() + '_' + Math.random().toString(36).slice(2, 6) + '.' + ext;
      const res = await fetch(SB_URL + '/storage/v1/object/evidence-proof/' + path, {
        method: 'POST',
        headers: {
          apikey: SB_KEY,
          Authorization: 'Bearer ' + ((session && session.access_token) || SB_KEY),
          'Content-Type': file.type || 'image/jpeg',
          'cache-control': '3600',
          'x-upsert': 'false'
        },
        body: file
      });
      if (!res.ok) {
        let t = '';
        try { t = await res.text(); } catch (e) {}
        throw new Error('截图上传失败（' + res.status + '）' + (t ? '：' + t.slice(0, 80) : ''));
      }
      return path;
    },
    async signProof(path) {
      const d = await http('/storage/v1/object/sign/evidence-proof/' + path, { method: 'POST', body: { expiresIn: 3600 } });
      const u = (d && (d.signedURL || d.signedUrl)) || '';
      return u ? (u.indexOf('http') === 0 ? u : SB_URL + u) : '';
    },

    /* ---------- 头像 / 封面（公开桶 resource-files） ---------- */
    async uploadImage(file, kind) {
      const uidv = session && session.user && session.user.id;
      if (!uidv) throw new Error('请先登录');
      if (!file) throw new Error('没有选到图片');
      if (file.size > 4 * 1024 * 1024) throw new Error('图片太大了，控制在 4MB 以内');
      const ext = ((file.name || '').split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 4) || 'jpg';
      const path = uidv + '/' + (kind || 'img') + '_' + Date.now() + '.' + ext;
      const put = async (opt) => {
        const res = await fetch(SB_URL + '/storage/v1/object/resource-files/' + path, {
          method: 'POST',
          headers: {
            apikey: SB_KEY,
            Authorization: 'Bearer ' + ((session && session.access_token) || SB_KEY),
            'Content-Type': file.type || 'image/jpeg',
            'cache-control': '3600',
            'x-upsert': opt.upsert ? 'true' : 'false'
          },
          body: file
        });
        if (res.ok) return '';
        let t = '';
        try { t = await res.text(); } catch (e) {}
        return res.status + '|' + t;
      };
      let fail = await put({ upsert: true });
      if (fail) fail = await put({ upsert: false });
      if (fail) {
        const code = String(fail).split('|')[0];
        let hint = '';
        if (code === '403' || code === '401') hint = '存储权限没开，去 Supabase 跑一次升级 SQL 里的「存储修复」那段';
        else if (code === '400') hint = '可能是文件格式或大小不被允许，换一张 jpg/png 试试';
        else if (code === '404') hint = '存储桶 resource-files 不存在，跑一次升级 SQL 里的「存储修复」那段';
        const body = fail.indexOf('|') > -1 ? fail.split('|')[1].slice(0, 120) : '';
        throw new Error('图片没传上去（' + code + '）' + (hint ? '：' + hint : '') + (body ? ' · ' + body : ''));
      }
      return SB_URL + '/storage/v1/object/public/resource-files/' + path;
    },

    /* ---------- 改资料（昵称 / 简介 / 头像 / 封面），ID 不可改 ---------- */

      Object.keys(row).forEach((k) => { me[k] = row[k]; });

  /* ---------- toast / sheet ---------- */
  function toast(msg) {
    const wrap = document.getElementById('toasts');
    const el = document.createElement('div');
    el.className = 'toast';
    el.textContent = msg;
    wrap.appendChild(el);
    setTimeout(() => { el.style.opacity = '0'; el.style.transition = '.3s'; }, 2100);
    setTimeout(() => el.remove(), 2500);
  }
  let modalOnClose = null;
  function openModal(opts) {
    const root = document.getElementById('modalRoot');
    modalOnClose = opts.onClose || null;
    root.innerHTML =
      '<div class="scrim" data-close="1"></div>' +
      '<div class="sheet-wrap"><div class="modal">' +
        '<div class="modal-grab"><span></span></div>' +
        '<div class="modal-head">' +
          '<div><div class="eyebrow">' + (opts.eyebrow || 'ZICORA') + '</div>' +
          '<div class="h2" style="margin-top:5px">' + opts.title + '</div>' +
          (opts.sub ? '<div class="hint" style="margin-top:4px">' + opts.sub + '</div>' : '') + '</div>' +
          '<button class="icon-btn" data-close="1" style="flex:0 0 38px">' + ic('x') + '</button>' +
        '</div>' +
        '<div class="modal-body">' + (opts.body || '') + '</div>' +
        (opts.foot ? '<div class="modal-foot">' + opts.foot + '</div>' : '') +
      '</div></div>';

    root.querySelectorAll('[data-close]').forEach((n) => n.addEventListener('click', closeModal));

  }
  function closeModal() {

    root.classList.remove('on');
    root.innerHTML = '';

  /* ---------- avatar ---------- */
  function avatar(user, size) {
    if (!user) return '<div class="avatar ' + (size || '') + '">?</div>';
    const tone = TONES[(user.color || 0) % TONES.length];
    const cls = 'avatar ' + (size || '');
    if (user.avatarImg) return '<div class="' + cls + '"><img src="' + user.avatarImg + '" alt=""></div>';
    return '<div class="' + cls + '" style="background:' + tone.bg + ';color:' + tone.fg + ';border-color:' + tone.bg + '">' + esc(String(user.avatar || user.name.slice(0, 1)).slice(0, 1)) + '</div>';
  }

  /* ---------- praise（帖子形态） ---------- */
  function praiseCard(p) {
    const u = Store.user(p.authorId) || { name: '已离开的成员', color: 4, avatar: '?' };
    const liked = Store.me() ? p.likedBy.indexOf(Store.me().id) > -1 : false;
    const typeName = { card: '字卡夸夸', resource: '资源夸夸', member: '成员夸夸', community: '社区夸夸' }[p.type];
    return '<div class="praise">' +
      '<div class="p-head">' + avatar(u, 'sm') +
        '<div style="min-width:0"><div class="p-name">' + esc(u.name) + '</div>' +
        '<div class="p-sub">' + relTime(p.date) + '</div></div>' +
        '<span class="p-kind">' + typeName + '</span>' +
      '</div>' +
      '<div class="p-text">' + esc(p.text) + '</div>' +

  /* ---------- 资源库 ---------- */
  let libState = { cat: 'all', q: '', sort: 'new' };
  function viewLibrary() {
    const d = Store.data;
    const pub = d.resources.filter((r) => r.status === 'published');
    let list = pub.slice();
    if (libState.cat !== 'all') list = list.filter((r) => r.cat === libState.cat);
    if (libState.q) {
      const q = libState.q.toLowerCase();
      list = list.filter((r) => (r.name + r.desc + ((Store.user(r.authorId) || { name: '' }).name)).toLowerCase().indexOf(q) > -1);
    }
    if (libState.sort === 'hot') list.sort((a, b) => b.downloads - a.downloads);
    else if (libState.sort === 'like') list.sort((a, b) => b.likes - a.likes);
    else list.sort((a, b) => new Date(b.date) - new Date(a.date));

    const counts = (id) => id === 'all' ? pub.length : pub.filter((r) => r.cat === id).length;

    return '' +
    '<div class="row gap-8" style="margin-bottom:14px">' +
      '<div class="grow" style="position:relative">' +
        '<span style="position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted-2);display:flex">' + ic('search') + '</span>' +
        '<input class="input" id="libSearch" placeholder="搜索资源、作者…" value="' + esc(libState.q) + '" style="padding-left:36px;height:38px;border-radius:19px;font-size:12.5px">' +
      '</div>' +
      '<button class="btn btn--sm btn--ghost" data-upload="1" style="flex:0 0 auto;height:38px;border-radius:19px;padding:0 13px;gap:3px">' + ic('plus') + ' 上传</button>' +
    '</div>' +

    '<div class="rail" style="margin:0 -16px 14px">' +
      '<div class="chip ' + (libState.cat === 'all' ? 'active' : '') + '" data-cat="all" style="flex:0 0 auto">全部' + (counts('all') ? ' ' + counts('all') : '') + '</div>' +
      CATS.map((c) => '<div class="chip ' + (libState.cat === c.id ? 'active' : '') + '" data-cat="' + c.id + '" style="flex:0 0 auto">' + c.name + (counts(c.id) ? ' ' + counts(c.id) : '') + '</div>').join('') +
    '</div>' +

  function bump() { window.dispatchEvent(new HashChangeEvent('hashchange')); }

  function praiseModal() {
    openModal({
      eyebrow: 'New Praise',
      title: '写一条夸夸',
      sub: '夸具体的东西，比夸「很好」更有分量。',
      body:
        '<div class="field"><div class="label">夸夸类型 <span class="req">*</span></div>' +
          '<div class="opts" id="prType">' +
            [['card', '字卡夸夸'], ['resource', '资源夸夸'], ['member', '成员夸夸'], ['community', '社区夸夸']].map(([k, n], i) =>
              '<label class="opt ' + (i === 0 ? 'on' : '') + '" data-val="' + k + '"><input type="radio" name="prt">' + n + '</label>').join('') +
          '</div></div>' +
        '<div class="field"><div class="label">内容 <span class="req">*</span></div>' +
          '<textarea class="textarea" id="prText" placeholder="写下你真正注意到的那个细节：一处字距、一个配色、一次耐心的解答…"></textarea>' +
          '<div class="hint">建议 60 字以上。</div></div>' +
        '<div class="field" style="margin-bottom:0"><div class="label">关联对象 <span class="small" style="color:var(--muted-2)">可选</span></div>' +
          '<input class="input" id="prTarget" placeholder="资源名 / 字卡名 / 成员昵称"></div>',
      foot: '<button class="btn btn--ghost" data-close="1">取消</button><button class="btn btn--ink" id="prSubmit">' + ic('heart') + ' 发布</button>',
      onMount: (root) => {
        const sub = root.querySelector('#prSubmit');
        if (!sub) return;
        sub.addEventListener('click', () => {
          const t = root.querySelector('#prType .opt.on');
          const ta = root.querySelector('#prText');
          const text = (ta && ta.value || '').trim();
          if (!text) { toast('请先写下内容'); return; }
          const me = Store.me();
          if (!me) { toast('请先登录'); return; }
          Store.add('praise', {
            id: uid('p'), type: t ? t.getAttribute('data-val') : 'card', text: text,
            targetId: '', targetName: (root.querySelector('#prTarget').value || '').trim(),
            authorId: me.id, date: now(), likedBy: [], comments: []
          });
          closeModal(); toast('已发布到夸夸墙'); bump();
        });
      }
    });
  }

  function commentModal(pid) {
    const p = Store.data.praise.find((x) => x.id === pid);
    if (!p) return;
    const u = Store.user(p.authorId) || { name: '' };
    openModal({
      eyebrow: 'Comments',
      title: '评论',
      sub: '评论公开可见，请当作当面说。',
      body:
        '<div id="cmWrap" data-pid="' + pid + '">' +
        '<div style="background:var(--paper-2);border-radius:14px;padding:13px 14px;margin-bottom:14px">' +
          '<div class="p-text" style="font-size:13.5px;margin:0">' + esc(p.text) + '</div>' +
          '<div class="small" style="margin-top:6px">— ' + esc(u.name) + ' · ' + fmtDate(p.date) + '</div></div>' +
        '<div id="cmList">' + (p.comments.length ? p.comments.map((c) =>
          '<div style="padding:11px 0;border-bottom:1px solid var(--line-2)"><div class="row between"><span class="small" style="color:var(--ink-2)">' + esc(c.byName) + '</span><span class="small" style="font-size:10.5px;color:var(--muted-2)">' + fmtDate(c.date) + '</span></div>' +
          '<div style="font-size:12.5px;margin-top:3px">' + esc(c.text) + '</div></div>').join('') : '<div class="empty" style="padding:22px">还没有评论，等你说第一句。</div>') + '</div>' +
        '<div class="row gap-8" style="margin-top:12px"><input class="input" id="cmInput" placeholder="写下你的评论…"><button class="btn btn--ink btn--sm" id="cmSend">发送</button></div></div>',
      foot: '<button class="btn btn--ghost" data-close="1">关闭</button>',
      onMount: (root) => {
        const btn = root.querySelector('#cmSend');
        const inp = root.querySelector('#cmInput');
        if (!btn || !inp) return;
        const submit = () => {
          const v = (inp.value || '').trim();
          if (!v) return;
          const target = Store.data.praise.find((x) => x.id === pid);
          if (!target) return;
          const me = Store.me();
          target.comments.push({ by: me.id, byName: me.name, text: v, date: now() });
          Store.save(); closeModal(); toast('评论已发布'); bump();
        };
        btn.addEventListener('click', submit);
        inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); submit(); } });
      }
    });
  }

  let meTab = 'subs';
  function viewMe() {
    const me = Store.me();
    if (!me) return '';
    const myRes = Store.data.resources.filter((r) => r.authorId === me.id);
    const myBug = Store.data.bugs.filter((b) => b.userId === me.id);
    const bookmarked = Store.data.resources.filter((r) => (r.bookmarkedBy || []).indexOf(me.id) > -1);
    const myPraise = Store.data.praise.filter((p) => p.authorId === me.id);
    const likesGiven = myRes.reduce((a, r) => a + (r.likes || 0), 0);
    const dlTotal = myRes.reduce((a, r) => a + (r.downloads || 0), 0);
    const praised = Store.data.praise.filter((p) => myRes.some((r) => p.targetId === r.id || p.targetId === String(r._db))).length;
    const isSuper = me.role === 'super';
    const isAdmin = Store.isAdmin();
    const memCount = Store.data.users.filter((u) => ['member','admin','super'].indexOf(u.role) >= 0).length;
    const pendJoins = Store.waitApps ? Store.waitApps('join').length : 0;
    const pendRes = Store.data.resources.filter((r) => r.status === 'pending').length;
    const pendAdmin = Store.waitApps ? Store.waitApps('admin').length : 0;
    const codes = Store.data.invites.filter((i) => i.status === 'unused').length;
    const admins = Store.data.users.filter((u) => u.role === 'admin').length;
    const sid = isSuper ? (me.handle || '71931')
                        : 'ID ' + String(me.id || '').replace(/-/g, '').slice(0, 8).toUpperCase();
    const cover = me.banner ? "background-image:url('" + esc(me.banner) + "');background-size:cover;background-position:center" : '';
    const badge = isSuper ? '<div class="zc-badge zc-badge--super">站长 · 超级管理员</div>'
                : isAdmin ? '<div class="zc-badge zc-badge--admin">管理员</div>'
                : '<div class="zc-badge zc-badge--member">成员</div>';
    const joined = me.joined ? fmtDate(me.joined) : '';
    const days = (function () {
      if (!me.joined) return 0;
      const n = Math.floor((Date.now() - new Date(me.joined).getTime()) / 86400000) + 1;
      return n < 1 ? 1 : n;
    })();
    const stat4 = isSuper
      ? [[memCount,'成员'],[Store.data.resources.length,'资源'],[dlTotal + Store.data.resources.reduce((a,r)=>a+(r.downloads||0),0),'总下载'],[admins,'管理员']]
      : isAdmin
      ? [[myRes.length,'资源'],[likesGiven,'收到赞'],[myPraise.length,'我夸过'],[codes,'可用码']]
      : [[myRes.length,'资源'],[likesGiven,'收到赞'],[praised,'被夸'],[dlTotal,'下载']];

    return '' +
    '<div class="zc-cover ' + (isSuper ? 'zc-cover--dark' : '') + '" style="' + cover + '">' +
      '<button class="zc-cover-btn" id="editCoverBtn">换封面</button>' +
    '</div>' +
    '<div class="zc-me">' +
      '<div class="zc-me-head">' +
        '<div class="zc-av">' + (/^https?:|^data:/.test(me.avatar || '') ? '<img src="' + esc(me.avatar) + '" alt="">' : (isSuper ? '71931' : esc((me.name || 'Z').slice(0,1))) ) + '</div>' +
        '<div style="padding-top:32px">' +
          '<div class="zc-name">' + esc(isSuper ? 'Zicora 站长' : me.name) + '</div>' +
          badge +
        '</div>' +
        '<button class="icon-btn" id="editProfile" aria-label="编辑资料" style="margin-left:auto">' + ic('edit') + '</button>' +
      '</div>' +
      '<div class="zc-sub">' + (isSuper ? '建站 ' + days + ' 天 · 站点拥有者' : esc(me.bio || '字卡 / 主题') + (joined ? ' · 加入 ' + days + ' 天' : '')) + '</div>' +
      '<div class="zc-id"><span class="pill">' + esc(sid) + '</span><i>' + (isSuper ? '固定不变 · 转让需密码' : '固定不变') + '</i></div>' +

      (isAdmin
        ? '<div class="zc-console-card ' + (isSuper ? 'zc-console-card--dark' : '') + '" data-go="#/admin">' +
            '<div><div class="t">' + (isSuper ? '进入超级管理后台' : '进入管理后台') + '</div>' +
            '<div class="s">' + (isSuper ? '管理员申请 ' + pendAdmin + ' · 待审加入 ' + pendJoins : '待审 ' + (pendJoins + pendRes) + ' 项 · 可用码 ' + codes + ' 枚') + '</div></div>' +
            '<div class="go">打开</div></div>'
        : '') +

      '<div class="zc-stats">' + stat4.map((x) => '<div><div class="n">' + x[0] + '</div><div class="l">' + x[1] + '</div></div>').join('') + '</div>' +

      '<div class="zc-row" id="editProfileBtn"><div>编辑资料<small>头像 / 名字 / 简介</small></div><div class="r">→</div></div>' +
      '<div class="zc-row" data-mtab="subs"><div>我的上传<small>' + myRes.length + ' 份</small></div><div class="r">→</div></div>' +
      '<div class="zc-row" data-mtab="marks"><div>下载记录<small>收藏 ' + bookmarked.length + '</small></div><div class="r">→</div></div>' +
      '<div class="zc-row" data-mtab="praise"><div>我收到的夸<small>' + praised + ' 条 · 我写的 ' + myPraise.length + '</small></div><div class="r">→</div></div>' +

        ? '<div class="zc-row" data-go="#/admin"><div>' + (isSuper ? '任命 / 收回管理员' : '我的审核记录') + '</div><div class="r">→</div></div>'

      (isSuper
        ? '<div class="zc-row" data-go="#/admin"><div>站点设置<small>开关 / 清空 / 导出</small></div><div class="r">→</div></div>' +

      '<div class="zc-note">' + (isSuper ? '唯一能批管理员、清空数据的人。<br>这个 ID 不能改，也不能被别人占。'

      '<div class="zc-signout" id="signOut2">退出登录</div>' +
    '</div>';
  }

  function mePane(tab, me) {
    const myRes = Store.data.resources.filter((r) => r.authorId === me.id);
    const myBug = Store.data.bugs.filter((b) => b.userId === me.id);
    const bookmarked = Store.data.resources.filter((r) => (r.bookmarkedBy || []).indexOf(me.id) > -1);
    const myPraise = Store.data.praise.filter((p) => p.authorId === me.id);

    if (tab === 'subs') {
      if (!myRes.length) return '<div class="card empty"><span class="e-mark">Z</span>还没有投稿。去资源库上传第一份吧。<br><button class="btn btn--sm" style="margin-top:12px" data-upload="1">上传资源</button></div>';
      return '<div class="grid g3" style="gap:3px">' + myRes.map((r) =>
        '<div data-res="' + r.id + '" style="position:relative">' + resCard(r) +
        (r.status !== 'published' ? '<span class="tag ' + (r.status === 'pending' ? 'tag-gold' : '') + '" style="position:absolute;top:6px;right:6px;background:rgba(255,255,255,.9)">' +
          (r.status === 'pending' ? '审核中' : r.status === 'rejected' ? '未通过' : '已下架') + '</span>' : '') +
        '</div>').join('') + '</div>';
    }
    if (tab === 'bugs') {
      if (!myBug.length) return '<div class="card empty"><span class="e-mark">?</span>还没有提交过反馈。<br><button class="btn btn--sm" style="margin-top:12px" data-go="#/bugs/new">提交反馈</button></div>';
      return myBug.map(bugRow).join('');
    }
    if (tab === 'marks') {
      if (!bookmarked.length) return '<div class="card empty"><span class="e-mark">☆</span>还没有收藏资源。</div>';
      return '<div class="grid g3" style="gap:3px">' + bookmarked.map(resCard).join('') + '</div>';
    }
    if (tab === 'praise') {
      if (!myPraise.length) return '<div class="card empty"><span class="e-mark">”</span>还没有写过夸夸。<br><button class="btn btn--sm" style="margin-top:12px" data-praise-new="1">写一条</button></div>';
      return myPraise.map(praiseCard).join('');
    }
    if (tab === 'account') {
      const sid = String(me.id || '').replace(/-/g, '').slice(0, 8).toUpperCase();
      const roleName = me.role === 'super' ? '超级管理员' : me.role === 'admin' ? '管理员' : '正式成员';
      return '<div class="card pad"><div class="h3" style="margin-bottom:14px">账号</div>' +
        '<div class="kv"><span class="k">社区 ID</span><span class="v mono-num" style="letter-spacing:.08em">' + esc(sid) + '</span></div>' +
        '<div class="kv"><span class="k">昵称</span><span class="v">' + esc(me.name) + '</span></div>' +
        '<div class="kv"><span class="k">登录邮箱</span><span class="v">' + esc(me.email || '—') + '</span></div>' +
        '<div class="kv"><span class="k">身份</span><span class="v">' + roleName + '</span></div>' +
        '<div class="kv"><span class="k">邀请码</span><span class="v mono-num" style="font-size:11px">' + esc(me.invite || '—') + '</span></div>' +
        '<button class="btn btn--ghost btn-block" id="editProfileBtn" style="margin-top:14px">编辑昵称 / 头像 / 封面</button>' +
        '<div class="hint" style="margin-top:12px">ID 由系统分配，终身不变；昵称、头像、封面随时可以换。</div></div>' +
        '<div class="card pad" style="margin-top:12px"><div class="h3" style="margin-bottom:12px">账号与安全</div>' +
        '<div class="btn-row"><button class="btn btn--sm btn--ghost" id="pwBtn">修改密码</button><button class="btn btn--sm btn--danger" id="signOut2">退出登录</button></div></div>';
    }
    if (tab === 'privacy') {

        ['hideMarks', '隐藏我的收藏列表', '其他成员看不到你收藏了哪些资源'],
        ['noPraiseNotify', '不在夸夸墙提醒我', '有人夸你时不产生额外提示'],
        ['showReport', '公开我的反馈记录', '默认关闭，只有你与管理员可见'],
        ['allowDM', '允许私聊', '本项目固定关闭，社区不提供任何私聊能力']
      ];
      return '<div class="card pad">' +
        '<div class="h3" style="margin-bottom:4px">隐私设置</div>' +

        items.map(([k, name, desc]) => {
          const on = k === 'allowDM' ? false : !!prefs[k];
          return '<div class="row between" style="padding:13px 0;border-bottom:1px solid var(--line-2);gap:14px">' +
            '<div style="min-width:0"><div style="font-size:13px">' + name + '</div><div class="hint">' + desc + '</div></div>' +
            '<div class="toggle" data-pref="' + k + '" data-on="' + (on ? 1 : 0) + '" style="width:42px;height:24px;border-radius:20px;border:1px solid ' + (on ? 'var(--sage-deep)' : 'var(--line-strong)') + ';background:' + (on ? 'var(--sage-soft)' : 'var(--paper-2)') + ';position:relative;cursor:pointer;flex:0 0 42px;' + (k === 'allowDM' ? 'opacity:.45;' : '') + '">' +
            '<span style="position:absolute;top:2px;' + (on ? 'right:2px' : 'left:2px') + ';width:18px;height:18px;border-radius:50%;background:' + (on ? 'var(--sage-deep)' : '#C9C0AD') + '"></span></div>' +
          '</div>';

        '<div class="hint" style="margin-top:14px">「允许私聊」固定关闭且不可开启：社区不设私信、好友一对一、私聊入口或私聊通知。</div></div>';
    }
    return '';
  }

    '</div>';

  function bindChanges() {
    const names = { apAge: 'apAgeName', apXhs: 'apXhsName', apQq: 'apQqName', apFollow: 'apFollowName' };
    document.addEventListener('change', (e) => {
      const id = e.target && e.target.id;
      if (!names[id] || !e.target.files || !e.target.files[0]) return;
      const f = e.target.files[0];

  /* ---------- 管理员审核材料时补签名链接 ---------- */
  async function hydrateProofs() {
    const imgs = Array.prototype.slice.call(document.querySelectorAll('img[data-proof]'));
    for (const img of imgs) {
      const p = img.getAttribute('data-proof');
      if (!p || img.getAttribute('data-signed') === '1') continue;
      img.setAttribute('data-signed', '1');
      try {
        const url = await Store.signProof(p);
        if (url) img.src = url;
      } catch (e) { img.alt = '图片打不开'; }
    }
  }
