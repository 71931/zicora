/* ============================================================
   Zicora Community — 路由 / 事件 / 交互
   ============================================================ */
(function () {
  'use strict';
  const { Store, CATS, BUG_STATUS, utils } = Z;
  const { esc, uid, now, fmtDate, fmtTime, relTime } = utils;
  const { ic, toast, openModal, closeModal, avatar, renderNav, renderSideUser } = ZV;
  const V2 = ZV2, V3 = ZV3, ZG = window.ZG;

  const viewEl = document.getElementById('view');
  let busy = false;
  let lastKey = '';

  /* ---------- 路由 ---------- */
  function parseHash() {
    const h = (location.hash || '#/home').replace(/^#\/?/, '');
    const parts = h.split('/').filter(Boolean);
    return { route: parts[0] || 'home', sub: parts[1] || '' };
  }
  function go(hash) { location.hash = hash; }
  function setAuthMode(m) { V2.setAuthMode(m); render(); }

  function render() {
    if (Store.loadError) {
      viewEl.innerHTML = '<div class="gate"><div class="g-mark">Z</div>' +
        '<h1 class="h1" style="font-size:22px;margin-top:14px">连不上社区服务器。</h1>' +
        '<p class="lede" style="margin-top:12px">' + esc(Store.loadError) + '</p>' +
        '<p class="small" style="margin-top:8px;color:var(--muted-2)">这台设备的网络访问不到数据库。换一个网络试试，或者稍后重试。</p>' +
        '<button class="btn btn--ghost" style="margin-top:20px" onclick="location.reload()">重新加载</button></div>';
      return;
    }
    if (!Store.hydrated) {
      viewEl.innerHTML = '<div class="gate"><div class="g-mark">Z</div>' +
        '<p class="lede" style="margin-top:16px">正在连接社区…</p></div>';
      return;
    }
    const { route, sub } = parseHash();
    const me = Store.me();
    const role = me ? me.role : '';
    let html = '';
    let navRoute = route;
    let gated = false;

    const myApp = me ? Store.appOf(me.id) : null;
    const entryMode = (route === 'apply' || route === 'register' || route === 'join' || route === 'user') ? 'apply' : 'login';

    if (!me) {
      gated = true; navRoute = 'entry';
      html = ZG.viewEntry(entryMode);
    } else if (me.banned) {
      gated = true; navRoute = 'entry'; html = bannedView();
    } else if (role === 'applicant' || role === 'approved') {
      gated = true; navRoute = 'apply'; html = ZG.viewMine(me, myApp);
    } else if (!Store.canEnter()) {
      gated = true; navRoute = 'entry'; html = ZG.viewEntry('login');
    } else if (route === 'home') {
      html = ZV.viewHome();
    } else if (route === 'zicora') {
      html = ZV.viewZicora();
    } else if (route === 'library') {
      html = ZV.viewLibrary();
    } else if (route === 'bugs') {
      html = V2.viewBugs(sub);
    } else if (route === 'chat') {
      html = V2.viewChat();
    } else if (route === 'repo') {
      html = V2.viewRepo();
    } else if (route === 'me') {
      html = V2.viewMe();
    } else if (route === 'admin') {
      html = Store.isAdmin() ? V3.viewAdmin() : deniedView();
    } else {
      html = ZV.viewHome();
    }

    const phone = document.getElementById('phone');
    if (phone) phone.classList.toggle('gate-mode', gated);
    renderNav(navRoute);
    renderSideUser();
    ZV.renderAppBar(navRoute, sub);
    viewEl.classList.toggle('chat-mode', navRoute === 'chat');
    viewEl.innerHTML = html;
    bind();
    if (ZG && ZG.hydrateProofs) ZG.hydrateProofs();

    const key = route + '/' + sub + '/' + navRoute;
    if (key !== lastKey) { viewEl.scrollTop = 0; lastKey = key; }

    // 聊天滚动到底
    if (route === 'chat' && Store.canEnter()) {
      const body = document.getElementById('chatBody');
      if (body) body.scrollTop = body.scrollHeight;
    }
    document.title = 'Zicora Community · ' + ({
      home: '社区首页', zicora: '字卡传讯', library: '资源库', bugs: 'BUG 反馈',
      chat: '聊天大厅', repo: '夸夸墙', me: '个人中心', admin: '管理后台', login: '登录'
    }[route] || '社区');
  }

  function bannedView() {
    return '<div class="gate"><div class="g-mark">Z</div>' +
      '<h1 class="h1" style="font-size:22px;margin-top:14px">这个账号已被停用。</h1>' +
      '<p class="lede" style="margin-top:12px">如果你认为这是误判，可以在公开的「使用帮助」频道里说明情况，管理员会看到。</p>' +
      '<button class="btn btn--ghost" style="margin-top:20px" data-signout="1">退出登录</button></div>';
  }
  function deniedView() {
    return '<div class="gate"><div class="g-mark">Z</div>' +
      '<h1 class="h1" style="font-size:22px;margin-top:14px">管理后台只对超级管理员开放。</h1>' +
      '<p class="lede" style="margin-top:12px">当前身份没有管理权限。此页面在前端隐藏，正式版同时由服务端 RLS 拒绝。</p>' +
      '<button class="btn btn--ghost" style="margin-top:20px" data-go="#/home">回到首页</button></div>';
  }

  /* ============================================================
     事件：统一委托
     ============================================================ */
  document.addEventListener('click', function (e) {
    const t = e.target;
    const hit = (attr) => t.closest('[' + attr + ']');
    const me = Store.me();
    const $ = (id) => document.getElementById(id);
    const val = (id) => { const el = document.getElementById(id); return el ? String(el.value || '').trim() : ''; };
    const fileOf = (id) => { const el = document.getElementById(id); return el && el.files && el.files[0] ? el.files[0] : null; };

    /* 关闭弹窗 */
    if (t.closest('[data-close]')) { closeModal(); return; }

    /* 导航 */
    const g = hit('data-go');
    if (g) { go(g.getAttribute('data-go')); closeDrawer(); return; }

    /* 资源详情 */
    const resId = hit('data-res');
    if (resId) { ZV.openResource(resId.getAttribute('data-res')); return; }

    /* 分类筛选 */
    const cat = hit('data-cat');
    if (cat) { ZV.setLibState({ cat: cat.getAttribute('data-cat') }); render(); return; }

    /* 搜索排序 */
    const pfilter = hit('data-pfilter');
    if (pfilter) { V2.setRepoFilter(pfilter.getAttribute('data-pfilter')); render(); return; }

    /* 点赞 */
    const like = hit('data-like');
    if (like) {
      const p = Store.data.praise.find((x) => x.id === like.getAttribute('data-like'));
      if (p && me) {
        const i = p.likedBy.indexOf(me.id);
        if (i > -1) p.likedBy.splice(i, 1); else p.likedBy.push(me.id);
        Store.save(); render();
      }
      return;
    }
    /* 评论 */
    const cm = hit('data-comment');
    if (cm) { V2.commentModal(cm.getAttribute('data-comment')); return; }

    /* 收藏 */
    const bm = hit('data-bookmark');
    if (bm) {
      const r = Store.data.resources.find((x) => x.id === bm.getAttribute('data-bookmark'));
      if (r && me) {
        r.bookmarkedBy = r.bookmarkedBy || [];
        const i = r.bookmarkedBy.indexOf(me.id);
        if (i > -1) { r.bookmarkedBy.splice(i, 1); toast('已取消收藏'); }
        else { r.bookmarkedBy.push(me.id); toast('已加入收藏'); }
        Store.save(); closeModal(); render();
      }
      return;
    }
    /* 下载资源 */
    const get = hit('data-get');
    if (get) {
      const r = Store.data.resources.find((x) => x.id === get.getAttribute('data-get'));
      if (r) {
        r.downloads++;
        Store.save();
        if (r.external) { toast('正在前往下载页…'); try { window.open(r.external, '_blank', 'noopener'); } catch (err) {} }
        else toast('已开始下载：' + (r.files[0] || r.name));
        render();
      }
      return;
    }
    /* 管理员/作者删除资源 */
    const adel = hit('data-admin-del');
    if (adel) {
      const r = Store.data.resources.find((x) => x.id === adel.getAttribute('data-admin-del'));
      confirmModal('删除资源？', '《' + (r ? r.name : '') + '》将从数据库移除，不可恢复。', () => {
        Store.remove('resources', adel.getAttribute('data-admin-del'));
        closeModal(); toast('已删除'); render();
      });
      return;
    }

    /* 字卡下载/网页版 */
    const dl = hit('data-download');
    if (dl) {
      const cfg = Store.data.config;
      const kind = dl.getAttribute('data-download');
      if (kind === 'apk') { toast('APK 下载已开始（占位链接）'); try { window.open(cfg.apkUrl, '_blank', 'noopener'); } catch (e) {} }
      else { toast('正在打开网页版传讯…'); try { window.open(cfg.webUrl, '_blank', 'noopener'); } catch (e) {} }
      return;
    }
    if (hit('data-changelog')) {
      openModal({
        width: 600, eyebrow: 'Changelog', title: '版本更新日志',
        body: Store.data.config.changelog.map((c) =>
          '<div style="padding:14px 0;border-bottom:1px solid var(--line-2)"><div class="row between"><span class="h3 mono-num" style="font-size:14px">v' + esc(c.v) + '</span>' +
          '<span class="small" style="font-size:11px">' + fmtDate(c.date) + '</span></div>' +
          '<ul style="margin:8px 0 0;padding-left:16px;font-size:12.5px;line-height:1.95;color:var(--ink-2)">' + c.items.map((i) => '<li>' + esc(i) + '</li>').join('') + '</ul></div>').join(''),
        foot: '<button class="btn btn--ghost" data-close="1">关闭</button>'
      });
      return;
    }

    /* 上传资源 */
    if (hit('data-upload')) { openUpload(); return; }

    /* 夸夸 */
    if (hit('data-praise-new')) { V2.praiseModal(); return; }

    /* 聊天空格 */
    const ch = hit('data-ch');
    if (ch) { V2.setChatCh(ch.getAttribute('data-ch')); V2.setChatReply(null); render(); return; }
    const rep = hit('data-reply');
    if (rep) {
      const msgs = Store.data.chats[V2.getChatCh()] || [];
      const m = msgs.find((x) => x.id === rep.getAttribute('data-reply'));
      if (m) { const u = Store.user(m.userId); V2.setChatReply({ id: m.id, name: u ? u.name : '', excerpt: (m.text || '[附件]').slice(0, 40) }); render(); }
      return;
    }
    if (hit('data-cancel-reply')) { V2.setChatReply(null); render(); return; }
    if (hit('data-emoji-toggle')) {
      const bar = document.getElementById('emojiBar');
      if (bar) bar.style.display = bar.style.display === 'none' ? 'flex' : 'none';
      return;
    }
    const em = hit('data-emoji');
    if (em) {
      const input = document.getElementById('chInput');
      if (input) input.value += em.getAttribute('data-emoji');
      return;
    }

    /* 个人中心 tab */
    const mtab = hit('data-mtab');
    if (mtab) { V2.setMeTab(mtab.getAttribute('data-mtab')); render(); return; }

    /* 后台 tab */
    const atab = hit('data-atab');
    if (atab) { V3.setAdminTab(atab.getAttribute('data-atab')); render(); return; }
    const rtab = hit('data-restab');
    if (rtab) { V3.setResTab(rtab.getAttribute('data-restab')); render(); return; }
    const btab = hit('data-bugtab');
    if (btab) { V3.setBugFilter(btab.getAttribute('data-bugtab')); render(); return; }

    /* BUG 详情 */
    const bd = hit('data-bug-detail');
    if (bd) { V2.bugDetail(bd.getAttribute('data-bug-detail')); return; }

    /* 申请 / 登录 切换，退出 */
    const umode = hit('data-umode');
    if (umode) { go(umode.getAttribute('data-umode') === 'login' ? '#/login' : '#/apply'); render(); return; }
    if (hit('data-signout')) { Store.logout().then(() => { go('#/login'); render(); }); return; }
    if (hit('data-refresh')) { Store.hydrate().then(() => { toast('已刷新'); render(); }); return; }

    /* 截图点开看大图（管理员审材料用） */
    const zPv = hit('data-preview');
    if (zPv) {
      e.preventDefault();
      const path = zPv.getAttribute('data-preview');
      Store.signProof(path).then((url) => {
        if (!url) return toast('图片打不开');
        openModal({ width: 720, eyebrow: 'Proof', title: '材料原图',
          body: '<img src="' + esc(url) + '" style="width:100%;border-radius:10px">',
          foot: '<button class="btn btn--ghost" data-close="1">关闭</button>' });
      }).catch(() => toast('图片打不开'));
      return;
    }

    /* 三入口登录 / 建站 */
    const sp = t.closest('#spSubmit');
    if (sp) {
      const name = val('spName'), email = val('spEmail'), p1 = val('spPass'), p2 = val('spPass2');
      const err = $('spErr');
      const fail = (m) => { if (err) err.textContent = m; toast(m); };
      if (!name || !email || !p1) return fail('昵称、邮箱、密码都要填');
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return fail('邮箱格式不太对');
      if (p1.length < 8) return fail('密码至少 8 位');
      if (p1 !== p2) return fail('两次输入的密码不一样');
      if (err) err.textContent = '';
      Store.setupAdmin({ name, email, pass: p1 }).then((r) => {
        if (!r.ok) return fail(r.msg);
        toast('超级管理员已创建');
        go('#/admin'); render();
      });
      return;
    }
    const enB = t.closest('#enSubmit');
    if (enB) {
      const email = val('enEmail'), pw = val('enPw');
      const err = $('enErr');
      const fail = (m) => { if (err) err.textContent = m; };
      if (!email || !pw) return fail('邮箱和密码都要填');
      if (err) err.textContent = '';
      enB.disabled = true; enB.textContent = '正在登录…';
      Store.login(email, pw).then((r) => {
        enB.disabled = false; enB.textContent = '登录';
        if (!r.ok) return fail(r.msg);
        const role = Store.roleOf();
        if (role === 'super' || role === 'admin') go('#/admin');
        else if (role === 'member') go('#/home');
        else go('#/apply');
        render();
      });
      return;
    }

    /* 提交加入申请（四张截图） */
    const apB = t.closest('#apSubmit');
    if (apB) {
      const name = val('apName'), email = val('apEmail'), pw = val('apPw'), reason = val('apReason');
      const err = $('apErr');
      const fail = (m) => { if (err) err.textContent = m; toast(m); };
      const f = { age: fileOf('apAge'), xhs: fileOf('apXhs'), qq: fileOf('apQq'), follow: fileOf('apFollow') };
      if (!name || !email || !pw) return fail('昵称、邮箱、密码都要填');
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return fail('邮箱格式不太对');
      if (pw.length < 8) return fail('密码至少 8 位');
      if ((reason || '').trim().length < 5) return fail('申请理由写清楚一点，别只写「求进」');
      if (!f.age || !f.xhs || !f.qq || !f.follow) return fail('四张截图都要选上：年龄、小红书、QQ、关注');
      if (err) err.textContent = '';
      apB.disabled = true; apB.textContent = '正在上传材料…';
      Store.applyJoin({ name, email, pass: pw, reason, files: f }).then((r) => {
        apB.disabled = false; apB.textContent = '提交申请';
        if (!r.ok) return fail(r.msg);
        toast('申请已提交，等管理员审核');
        go('#/apply'); render();
      });
      return;
    }

    /* 用码进站 */
    const acB = t.closest('#acSubmit');
    if (acB) {
      const code = val('acCode');
      const err = $('acErr');
      if (!code) { if (err) err.textContent = '把邀请码填上'; return; }
      acB.disabled = true; acB.textContent = '正在验证…';
      Store.activate(code).then((r) => {
        acB.disabled = false; acB.textContent = '用这枚码进入社区';
        if (!r.ok) { if (err) err.textContent = r.msg; toast(r.msg); return; }
        toast('进来了'); go('#/home'); render();
      });
      return;
    }
    const cpy = hit('data-copy');
    if (cpy) {
      const code = cpy.getAttribute('data-copy');
      if (navigator.clipboard) navigator.clipboard.writeText(code).catch(() => {});
      toast('已复制 ' + code);
      return;
    }

    /* 成员申请当管理员 */
    const aa = hit('data-apply-admin');
    if (aa) {
      openModal({
        width: 560, eyebrow: 'Apply', title: '申请成为管理员',
        body: '<div class="field"><div class="label">理由</div>' +
          '<textarea class="textarea" id="aaReason" placeholder="你想帮忙做什么：审材料、发码、整理资源…" style="min-height:96px"></textarea></div>' +
          '<p class="hint">提交后由超级管理员审核；通过之后你会多出审材料和发码的权限。</p>',
        foot: '<button class="btn btn--ghost" data-close="1">取消</button><button class="btn btn--ink" data-apply-admin-send="1">提交</button>'
      });
      return;
    }
    if (hit('data-apply-admin-send')) {
      const reason = (document.getElementById('aaReason') || {}).value || '';
      if (reason.trim().length < 5) return toast('理由写清楚一点');
      Store.applyAdmin(reason).then((r) => {
        closeModal();
        toast(r.ok ? '申请已提交，等超管审核' : r.msg);
        if (r.ok) render();
      });
      return;
    }

    /* 后台审核：加入申请 / 管理员申请 */
    const ja = hit('data-j-approve');
    if (ja) {
      const uidv = ja.getAttribute('data-j-approve');
      Store.reviewJoin(uidv, true).then((r) => {
        toast(r.ok ? '已通过，邀请码已发给他' : r.msg);
        render();
      });
      return;
    }
    const jr = hit('data-j-reject');
    if (jr) {
      const uidv = jr.getAttribute('data-j-reject');
      Store.reviewJoin(uidv, false).then((r) => { toast(r.ok ? '已拒绝' : r.msg); render(); });
      return;
    }
    const pa = hit('data-p-approve');
    if (pa) {
      const uidv = pa.getAttribute('data-p-approve');
      Store.reviewAdmin(uidv, true).then((r) => { toast(r.ok ? '已升为管理员' : r.msg); render(); });
      return;
    }
    const pr = hit('data-p-reject');
    if (pr) {
      const uidv = pr.getAttribute('data-p-reject');
      Store.reviewAdmin(uidv, false).then((r) => { toast(r.ok ? '已拒绝' : r.msg); render(); });
      return;
    }

    /* 隐私开关 */
    const pref = hit('data-pref');
    if (pref) {
      const k = pref.getAttribute('data-pref');
      if (k === 'allowDM') { toast('「允许私聊」固定关闭，无法开启'); return; }
      const u = Store.me(); u.prefs = u.prefs || {};
      u.prefs[k] = !u.prefs[k]; if (Store.savePrefs) Store.savePrefs(u.id, u.prefs); Store.save(); render(); toast('设置已保存');
      return;
    }

    /* ---------- 后台操作 ---------- */
    const ap = hit('data-m-approve');
    if (ap) {
      const uid = ap.getAttribute('data-m-approve');
      Z.SB.rpc('review_application', { p_user: uid, p_approve: true })
        .then(function () { toast('已通过申请，邀请码正式核销'); return Store.hydrate(); })
        .then(function () { render(); })
        .catch(function (e) { toast('操作失败：' + (e.message || '未知错误')); });
      return;
    }
    const rj = hit('data-m-reject');
    if (rj) {
      const uid = rj.getAttribute('data-m-reject');
      confirmModal('拒绝这份申请？', '申请人将被移出审核队列，他用的邀请码会退回、可以再发给别人。', () => {
        closeModal(); render();
        Z.SB.rpc('review_application', { p_user: uid, p_approve: false })
          .then(function () { toast('已拒绝，邀请码已退回'); return Store.hydrate(); })
          .then(function () { render(); })
          .catch(function (e) { toast('操作失败：' + (e.message || '未知错误')); });
      });
      return;
    }
    const ban = hit('data-m-ban');
    if (ban) { Store.patch('users', ban.getAttribute('data-m-ban'), { banned: true }); toast('已封禁'); render(); return; }
    const unban = hit('data-m-unban');
    if (unban) { Store.patch('users', unban.getAttribute('data-m-unban'), { banned: false }); toast('已解封'); render(); return; }
    const mview = hit('data-m-view');
    if (mview) {
      const u = Store.user(mview.getAttribute('data-m-view'));
      openModal({ width: 560, eyebrow: 'Member', title: esc(u.name),
        body: '<div class="row gap-16" style="margin-bottom:18px">' + avatar(u, 'lg') +
          '<div><div class="h3">' + esc(u.handle || '') + '</div><div class="small">加入于 ' + fmtDate(u.joined) + '</div></div></div>' +
          '<div class="kv"><span class="k">简介</span><span class="v" style="max-width:340px">' + esc(u.bio || '—') + '</span></div>' +
          '<div class="kv"><span class="k">投稿</span><span class="v">' + Store.data.resources.filter((r) => r.authorId === u.id).length + ' 份</span></div>' +
          '<div class="kv"><span class="k">反馈</span><span class="v">' + Store.data.bugs.filter((b) => b.userId === u.id).length + ' 条</span></div>' +
          '<div class="kv"><span class="k">夸夸</span><span class="v">' + Store.data.praise.filter((p) => p.authorId === u.id).length + ' 条</span></div>',
        foot: '<button class="btn btn--ghost" data-close="1">关闭</button>' });
      return;
    }

    /* 邀请码 */
    const cp = hit('data-copy-code');
    if (cp) {
      const code = cp.getAttribute('data-copy-code');
      if (navigator.clipboard) navigator.clipboard.writeText(code).catch(() => {});
      toast('已复制 ' + code); return;
    }
    const vd = hit('data-void-code');
    if (vd) {
      const code = vd.getAttribute('data-void-code');
      Z.SB.rpc('void_invite', { p_code: code })
        .then(function () { toast('邀请码已作废'); return Store.hydrate(); })
        .then(function () { render(); })
        .catch(function (e) { toast('操作失败：' + (e.message || '未知错误')); });
      return;
    }

    /* 举报 */
    const rp = hit('data-report');
    if (rp) { if (ZV.reportOpen) ZV.reportOpen(rp.getAttribute('data-report'), rp.getAttribute('data-id'), rp.getAttribute('data-label')); return; }
    const rdw = hit('data-rep-down');
    if (rdw) {
      const rid = rdw.getAttribute('data-rep-down'), kind = rdw.getAttribute('data-kind'), dbid = rdw.getAttribute('data-db');
      const call = kind === 'praise'
        ? Z.SB.http('/rest/v1/praise?id=eq.' + rid, { method: 'DELETE' })
        : Z.SB.http('/rest/v1/resources?id=eq.' + rid, { method: 'PATCH', body: { status: 'offshelf' } });
      call.then(function () { return Z.SB.http('/rest/v1/reports?id=eq.' + dbid, { method: 'PATCH', body: { status: 'done' } }); })
        .then(function () { return Store.hydrate(); })
        .then(function () { toast('已处理'); render(); })
        .catch(function (e) { toast('处理失败：' + (e.message || '')); });
      return;
    }
    const rig = hit('data-rep-ignore');
    if (rig) {
      Z.SB.http('/rest/v1/reports?id=eq.' + rig.getAttribute('data-rep-ignore'), { method: 'PATCH', body: { status: 'done' } })
        .then(function () { return Store.hydrate(); })
        .then(function () { toast('已标记为已处理'); render(); })
        .catch(function (e) { toast('操作失败：' + (e.message || '')); });
      return;
    }

    /* 资源审核 */
    const ra = hit('data-r-approve');
    if (ra) { Store.patch('resources', ra.getAttribute('data-r-approve'), { status: 'published' }); toast('已通过并公开'); render(); return; }
    const rr = hit('data-r-reject');
    if (rr) { Store.patch('resources', rr.getAttribute('data-r-reject'), { status: 'rejected' }); toast('已拒绝'); render(); return; }
    const ro = hit('data-r-off');
    if (ro) { Store.patch('resources', ro.getAttribute('data-r-off'), { status: 'offshelf' }); toast('已下架'); render(); return; }
    const ron = hit('data-r-on');
    if (ron) { Store.patch('resources', ron.getAttribute('data-r-on'), { status: 'published' }); toast('已恢复公开'); render(); return; }
    const red = hit('data-r-edit');
    if (red) { openResEdit(red.getAttribute('data-r-edit')); return; }
    const rdl = hit('data-r-del');
    if (rdl) {
      confirmModal('删除资源？', '删除后不可恢复。', () => {
        Store.remove('resources', rdl.getAttribute('data-r-del')); closeModal(); toast('已删除'); render();
      });
      return;
    }

    /* BUG 回复 */
    const br = hit('data-bug-reply');
    if (br) { openBugReply(br.getAttribute('data-bug-reply')); return; }

    /* 频道 */
    const cht = hit('data-ch-toggle');
    if (cht) {
      const c = Store.data.channels.find((x) => x.id === cht.getAttribute('data-ch-toggle'));
      if (c) { c.enabled = !c.enabled; Store.save(); toast(c.enabled ? '频道已启用' : '频道已停用'); render(); }
      return;
    }
    const chd = hit('data-ch-del');
    if (chd) {
      const id = chd.getAttribute('data-ch-del');
      const c = Store.data.channels.find((x) => x.id === id);
      confirmModal('删除频道？', '#' + (c ? c.name : id) + ' 会被移除，历史消息一并删除，不可恢复。', () => {
        Z.SB.http('/rest/v1/channels?id=eq.' + encodeURIComponent(id), { method: 'DELETE' })
          .then(() => { Store.remove('channels', id); closeModal(); toast('频道已删除'); render(); })
          .catch((e) => toast('删除失败：' + (e.message || '')));
      });
      return;
    }
    const chr = hit('data-ch-rename');
    if (chr) {
      const c = Store.data.channels.find((x) => x.id === chr.getAttribute('data-ch-rename'));
      if (c) promptModal('修改频道名称', '频道名称', c.name, (v) => { c.name = v; Store.save(); toast('已保存'); render(); });
      return;
    }

    /* 夸夸管理 */
    const pv = hit('data-p-view');
    if (pv) { V2.commentModal(pv.getAttribute('data-p-view')); return; }
    const pd = hit('data-p-del');
    if (pd) {
      confirmModal('删除这条夸夸？', '删除后不可恢复。', () => {
        Store.remove('praise', pd.getAttribute('data-p-del')); closeModal(); toast('已删除'); render();
      });
      return;
    }

    /* 公告 */
    const nte = hit('data-nt-edit');
    if (nte) { openNoticeModal(nte.getAttribute('data-nt-edit')); return; }
    const ntd = hit('data-nt-del');
    if (ntd) {
      confirmModal('删除公告？', '删除后前台立即消失。', () => {
        Store.remove('announcements', ntd.getAttribute('data-nt-del')); closeModal(); toast('已删除'); render();
      });
      return;
    }

    /* 单选组 */
    const opt = t.closest('.opt') || (t.tagName === 'LABEL' ? t : null);
    if (opt && opt.parentElement && opt.parentElement.classList.contains('opts')) {
      const group = opt.parentElement;
      group.querySelectorAll('.opt').forEach((o) => o.classList.remove('on'));
      opt.classList.add('on');
      const parentField = group.closest('[data-group]');
      if (parentField) {
        const g = parentField.getAttribute('data-group');
        const val = opt.getAttribute('data-val');
        if (g === 'device') V2.setBugDraft({ device: val });
        if (g === 'mode') V2.setBugDraft({ mode: val });
        if (g === 'browser') V2.setBugDraft({ browser: val });
      }
      return;
    }

    /* 移除附件 */
    const rm = hit('data-rm-attach');
    if (rm) {
      const i = +rm.getAttribute('data-rm-attach');
      const d = V2.getBugDraft(); d.attach.splice(i, 1); render(); return;
    }
  });

  /* ---------- 表单类绑定 ---------- */
  function bind() {
    const $ = (id) => document.getElementById(id);

    /* 资源库搜索 */
    const ls = $('libSearch');
    if (ls) {
      ls.addEventListener('input', function () {
        ZV.setLibState({ q: this.value });
        const caret = this.selectionStart;
        render();
        const n = $('libSearch');
        if (n) { n.focus(); n.setSelectionRange(caret, caret); }
      });
    }
    const so = $('libSort');
    if (so) so.addEventListener('change', function () { ZV.setLibState({ sort: this.value }); render(); });

    /* BUG 表单 */
    const bf = $('bFile');
    if (bf) {
      bf.addEventListener('change', async function () {
        const d = V2.getBugDraft();
        for (const f of Array.from(this.files).slice(0, 3 - d.attach.length)) {
          try { d.attach.push(await V2.readFile(f)); } catch (e) {}
        }
        render();
      });
    }
    const bs = $('bSubmit');
    if (bs) {
      bs.addEventListener('click', function () {
        const d = V2.getBugDraft();
        d.version = val('bVersion'); d.page = val('bPage'); d.detail = val('bDetail');
        d.steps = val('bSteps'); d.expect = val('bExpect');
        const missing = [];
        if (!d.device) missing.push('使用设备');
        if (!d.mode) missing.push('使用方式');
        if (!d.version) missing.push('版本号');
        if (!d.browser) missing.push('浏览器');
        if (!d.page) missing.push('页面或功能');
        if (!d.detail) missing.push('具体问题');
        if (!d.steps) missing.push('复现步骤');
        if (!d.expect) missing.push('期望结果');
        if (missing.length) {
          const err = $('bErr');
          if (err) err.textContent = '还有 ' + missing.length + ' 项必填未完成：' + missing.join('、');
          toast('请补全必填项');
          const card = document.querySelector('.card.pad-lg');
          return;
        }
        const me = Store.me();
        Store.add('bugs', {
          id: uid('b'), userId: me.id, device: d.device, mode: d.mode, version: d.version,
          browser: d.browser, page: d.page, detail: d.detail, steps: d.steps, expect: d.expect,
          attach: d.attach, status: 'pending', date: now(), replies: []
        });
        V2.setBugDraft({ device: '', mode: '', version: '', browser: '', page: '', detail: '', steps: '', expect: '', attach: [] });
        toast('反馈已提交，管理员会尽快查看');
        go('#/bugs'); render();
      });
    }

    /* 聊天 */
    const send = $('chSend');
    if (send) send.addEventListener('click', sendChat);
    const input = $('chInput');
    if (input) {
      input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChat(); }
      });
      input.addEventListener('input', function () { this.style.height = 'auto'; this.style.height = Math.min(this.scrollHeight, 120) + 'px'; });
    }
    const img = $('chImg');
    if (img) img.addEventListener('change', async function () {
      if (!this.files[0]) return;
      const url = await V2.readFile(this.files[0]);
      pushChat({ text: '', attach: { type: 'image', url: url } });
    });
    const file = $('chFile');
    if (file) file.addEventListener('change', function () {
      if (!this.files[0]) return;
      const f = this.files[0];
      pushChat({ text: '', attach: { type: 'file', name: f.name, size: (f.size / 1024).toFixed(0) + ' KB' } });
    });

    /* 个人资料 */
    ['editProfile', 'editProfileBtn', 'editCoverBtn'].forEach((id) => {
      const el = $(id);
      if (el) el.addEventListener('click', () => openProfileEdit(id === 'editCoverBtn' ? 'cover' : ''));
    });
    ['signOut', 'signOut2'].forEach((id) => {
      const el = $(id);
      if (el) el.addEventListener('click', () => { Store.logout().then(() => { go('#/login'); render(); }); });
    });
    const acs = $('acSave');
    if (acs) acs.addEventListener('click', async () => {
      const u = Store.me();
      const r = await Store.updateProfile({ name: val('acName') || u.name, bio: val('acBio') });
      toast(r.ok ? '资料已保存' : r.msg); render();
    });
    const pw = $('pwBtn');
    if (pw) pw.addEventListener('click', () => toast('正式版由 Supabase Auth 处理密码修改'));

    /* 初始化管理员 */
    const su = $('suSubmit');
    if (su) su.addEventListener('click', async () => {
      const name = val('suName'), email = val('suEmail'), p1 = val('suPass'), p2 = val('suPass2');
      const err = $('suErr');
      const fail = (m) => { if (err) err.textContent = m; toast(m); };
      if (!name || !email || !p1) return fail('昵称、邮箱、密码都要填');
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return fail('邮箱格式不太对');
      if (p1.length < 8) return fail('密码至少 8 位');
      if (p1 !== p2) return fail('两次输入的密码不一样');
      if (err) err.textContent = '';
      const r = await Store.setupAdmin({ name, email, pass: p1 });
      if (!r.ok) return fail(r.msg);
      toast('管理员已创建');
      go('#/admin');
      render();
    });

    /* 登录 */
    const lg = $('lgSubmit');
    if (lg) lg.addEventListener('click', async () => {
      const btn = $('lgSubmit');
      if (btn) btn.disabled = true;
      const r = await Store.login(val('lgEmail'), val('lgPw'));
      if (btn) btn.disabled = false;
      if (!r.ok) { const e = $('lgErr'); if (e) e.textContent = r.msg; toast(r.msg); return; }
      toast('已登录');
      go('#/home'); render();
    });

    /* 邀请码注册 */
    const rg = $('rgSubmit');
    if (rg) rg.addEventListener('click', async () => {
      const btn = $('rgSubmit');
      if (btn) btn.disabled = true;
      const r = await Store.register({
        code: val('rgCode'), name: val('rgName'), email: val('rgEmail'),
        pass: val('rgPw'), reason: val('rgReason')
      });
      if (btn) btn.disabled = false;
      const err = $('rgErr');
      if (!r.ok) { if (err) err.textContent = r.msg; toast(r.msg); return; }
      toast('申请已提交，等待管理员审核');
      go('#/pending'); render();
    });

    /* 配置 */
    const cs = $('cfSave');
    if (cs) cs.addEventListener('click', () => {
      const c = Store.data.config;
      c.apkUrl = val('cfApk'); c.apkVersion = val('cfVer'); c.apkSize = val('cfSize');
      c.webUrl = val('cfWeb'); c.webNote = val('cfWebNote');
      const log = val('cfLog').split('\n').filter(Boolean).map((line) => {
        const p = line.split('|');
        let d = new Date();
        try { d = new Date((p[1] || '').replace(/\./g, '-')); } catch (e) {}
        if (isNaN(d.getTime())) d = new Date();
        return { v: (p[0] || '').trim(), date: d.toISOString(), items: (p[2] || '').split(';').filter(Boolean) };
      });
      if (log.length) c.changelog = log;
      Store.save(); toast('配置已保存，前台即刻生效'); render();
    });

    /* 后台新增 */
    const ni = $('newInvite');
    if (ni) ni.addEventListener('click', () => {
      const code = 'ZICORA-2026-' + Math.random().toString(36).slice(2, 6).toUpperCase();
      Store.add('invites', { code, status: 'unused', createdBy: (Store.me() || {}).id || '', createdAt: now(), usedBy: '', note: '手动生成' });
      toast('已生成 ' + code); render();
    });
    const ca = $('chAdd');
    if (ca) ca.addEventListener('click', () => {
      promptModal('新增频道', '频道名称', '', (v) => {
        Store.data.channels.push({ id: uid('c'), name: v, desc: '新建频道', order: Store.data.channels.length, enabled: true });
        Store.data.chats[Store.data.channels[Store.data.channels.length - 1].id] = [];
        Store.save(); toast('频道已创建'); render();
      });
    });
    const na = $('ntAdd');
    if (na) na.addEventListener('click', () => openNoticeModal(null));

    /* 夸夸 / 评论提交 */
    const prs = $('prSubmit');
    if (prs) prs.addEventListener('click', () => {
      const typeEl = document.querySelector('#prType .opt.on');
      const text = val('prText');
      if (!text.trim()) { toast('请先写下内容'); return; }
      const me = Store.me();
      Store.add('praise', {
        id: uid('p'), type: typeEl ? typeEl.getAttribute('data-val') : 'card', text: text.trim(),
        targetId: '', targetName: val('prTarget') || '', authorId: me.id, date: now(), likedBy: [], comments: []
      });
      closeModal(); toast('已发布到夸夸墙'); render();
    });
    const cms = $('cmSend');
    if (cms) cms.addEventListener('click', () => {
      const input = $('cmInput');
      const v = input && input.value.trim();
      if (!v) return;
      const mo = document.querySelector('.modal');
      const pid = mo && mo.dataset.pid;
      const target = Store.data.praise.find((x) => x.id === pid);
      if (target) {
        const me = Store.me();
        target.comments.push({ by: me.id, byName: me.name, text: v, date: now() });
        Store.save(); closeModal(); toast('评论已发布'); render();
      }
    });

    /* 后台 BUG 状态 */
    document.querySelectorAll('[data-bugstatus]').forEach((sel) => {
      sel.addEventListener('change', function () {
        Store.patch('bugs', this.getAttribute('data-bugstatus'), { status: this.value });
        toast('状态已更新'); render();
      });
    });
  }

  function val(id) { const el = document.getElementById(id); return el ? el.value.trim() : ''; }

  function sendChat() {
    const input = document.getElementById('chInput');
    if (!input || !input.value.trim()) return;
    pushChat({ text: input.value.trim(), attach: null });
    input.value = '';
  }
  function pushChat(obj) {
    const me = Store.me();
    const ch = V2.getChatCh();
    const reply = V2.getChatReply();
    Store.data.chats[ch] = Store.data.chats[ch] || [];
    Store.data.chats[ch].push({
      id: uid('m'), userId: me.id, text: obj.text || '', date: now(),
      replyTo: reply ? reply.id : null, attach: obj.attach || null
    });
    V2.setChatReply(null);
    Store.save(); render();
  }

  /* ---------- 弹窗辅助 ---------- */
  function confirmModal(title, sub, onOk) {
    openModal({
      width: 460, eyebrow: 'Confirm', title: title, sub: sub,
      body: '<div class="hint">这个动作会直接写入数据库。</div>',
      foot: '<button class="btn btn--ghost" data-close="1">取消</button><button class="btn btn--danger" id="cfmOk">确认</button>',
      onMount: (root) => {
        root.querySelector('#cfmOk').addEventListener('click', onOk);
      }
    });
  }
  function promptModal(title, label, def, onOk) {
    openModal({
      width: 480, eyebrow: 'Edit', title: title,
      body: '<div class="field" style="margin:0"><div class="label">' + label + '</div><input class="input" id="pmInput" value="' + esc(def) + '"></div>',
      foot: '<button class="btn btn--ghost" data-close="1">取消</button><button class="btn btn--ink" id="pmOk">保存</button>',
      onMount: (root) => {
        const inp = root.querySelector('#pmInput');
        inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length);
        root.querySelector('#pmOk').addEventListener('click', () => {
          if (!inp.value.trim()) return;
          closeModal(); onOk(inp.value.trim());
        });
      }
    });
  }

          '<div class="field"><div class="label">分类 <span class="req">*</span></div><select class="select" id="upCat">' +

          '<div class="field"><div class="label">授权说明 <span class="req">*</span></div><input class="input" id="upLicense" placeholder="例如：可自由使用，请勿二次售卖"></div>' +

          '<div class="hint">支持 zip / txt / ztheme / apk 等，单个不超过 50MB。</div></div>' +
        '<div class="field" style="margin-bottom:0"><div class="label">外部链接 <span class="small" style="color:var(--muted-2)">可选，填了就走外链下载</span></div>' +
          '<input class="input" id="upExternal" placeholder="https://…"></div>' +
        '<div class="banner" style="margin-top:6px">' + ic('shield') +

      onMount: (root) => {

          root.querySelector('#upFileName').textContent = fileName || '未选择文件';
        });
        root.querySelector('#upSubmit').addEventListener('click', () => {
          const name = root.querySelector('#upName').value.trim();
          const desc = root.querySelector('#upDesc').value.trim();
          const license = root.querySelector('#upLicense').value.trim();
          if (!name || !desc || !license) { toast('名称、介绍与授权说明是必填'); return; }
          const me = Store.me();
          Store.add('resources', {
            id: uid('r'), name: name, cat: root.querySelector('#upCat').value,
            authorId: me.id, version: root.querySelector('#upVer').value.trim() || '1.0',
            desc: desc, date: now(), downloads: 0, likes: 0, status: 'published',
            license: license, external: root.querySelector('#upExternal').value.trim(),
            glyph: name.slice(0, 1), tone: Math.floor(Math.random() * 10),
            files: fileName ? [fileName] : [], bookmarkedBy: []
          });
          closeModal(); toast('已提交，等待管理员审核'); render();
        });
      }
    });
  }

  function openResEdit(id) {
    const r = Store.data.resources.find((x) => x.id === id);
    if (!r) return;
    openModal({
      width: 620, eyebrow: 'Edit Resource', title: '编辑资源',
      body:
        '<div class="field"><div class="label">名称</div><input class="input" id="erName" value="' + esc(r.name) + '"></div>' +
        '<div class="grid g2" style="gap:0 18px">' +
          '<div class="field"><div class="label">分类</div><select class="select" id="erCat">' +
            CATS.map((c) => '<option value="' + c.id + '"' + (c.id === r.cat ? ' selected' : '') + '>' + c.name + '</option>').join('') + '</select></div>' +
          '<div class="field"><div class="label">版本</div><input class="input" id="erVer" value="' + esc(r.version) + '"></div>' +
        '</div>' +

/* ============================================================
   Zicora v2 · 叠加层（首页 / 资源库 / 夸夸 / 上传 / 下载追溯）
   放在所有分片之后加载，用同名导出覆盖旧视图
   ============================================================ */
(function () {
  const Z = window.Z;
  const ZV = window.ZV, V2 = window.V2, V3 = window.V3;
  if (!Z || !ZV) return;
  const Store = Z.Store, SB = Z.SB;
  const U = Z.utils;
  const esc = U.esc, uid = U.uid, now = U.now, fmtDate = U.fmtDate, relTime = U.relTime;
  const { ic, toast, openModal, closeModal, avatar } = ZV;

  const CATS3 = [{ id: 'card', name: '字卡' }, { id: 'copy', name: '文案' }, { id: 'theme', name: '主题' }, { id: 'bubble', name: '气泡' }, { id: 'plugin', name: '插件' }, { id: 'other', name: '其他' }];
  const catName = (id) => (CATS3.filter((c) => c.id === id)[0] || {}).name || '资源';
  const rerender = () => window.dispatchEvent(new HashChangeEvent('hashchange'));
  const tone = (r) => (ZV.TONES || [{ bg: '#F4F4F6', fg: '#6E6E76' }])[(r.tone || 0) % 10];
  const me = () => Store.me();
  const admin = () => Store.isAdmin();
  const dstr = (v) => (v ? String(v).slice(0, 10) : '');
  const firstSeenKey = () => 'zicora.firstseen.' + (me() ? me().id : 'anon');

  function greetWord() {
    const h = new Date().getHours();
    if (h < 5) return '晚上好';
    if (h < 11) return '早上好';
    if (h < 13) return '中午好';
    if (h < 18) return '下午好';
    return '晚上好';
  }

  /* ---------- 陪伴天数 ---------- */
  function joinedAt() {
    const m = me();
    if (m && m.joined) return new Date(m.joined).getTime();
    try {
      const k = firstSeenKey();
      let v = localStorage.getItem(k);
      if (!v) { v = String(Date.now()); localStorage.setItem(k, v); }
      return Number(v);
    } catch (e) { return Date.now(); }
  }
  function daysWith() {
    const t0 = joinedAt();
    const n = Math.floor((Date.now() - t0) / 86400000) + 1;
    return n < 1 ? 1 : n;
  }

  /* ---------- 资源状态 ---------- */
  function filesOf(r) {
    return (r.files || []).map((f) => (typeof f === 'string' ? { n: f, u: '' } : { n: f.n || '文件', u: f.u || '' }));
  }
  function liked(r) { const m = me(); return !!m && (r.likedBy || []).indexOf(m.id) > -1; }
  function praised(r) {
    const m = me();
    if (!m) return false;
    return Store.data.praise.some((p) => p.authorId === m.id && (p.targetId === r.id || p.targetId === String(r._db)));
  }
  function needList(r) {
    const out = [];
    if (r.needLike && !liked(r)) out.push('点赞');
    if (r.needComment && !praised(r)) out.push('留一句夸夸');
    return out;
  }

  /* ---------- 通用小块 ---------- */
  function pill(txt) { return '<span class="v2-pill">' + esc(txt) + '</span>'; }
  function line(k, v) { return '<div class="kv"><span class="k">' + k + '</span><span class="v">' + v + '</span></div>'; }

  /* ============================================================
     首页
     ============================================================ */
  ZV.viewHome = function () {
    const d = Store.data;
    const m = me();
    const pub = d.resources.filter((r) => r.status === 'published');
    const latest = pub.slice().sort((a, b) => new Date(b.date) - new Date(a.date)).slice(0, 4);

    const wall = d.praise.slice().sort((a, b) => new Date(b.date) - new Date(a.date)).slice(0, 2);
    const entries = [
      { r: 'library', t: '资源库', s: pub.length + ' 份已审核资源' },

      { r: 'chat', t: '聊天大厅', s: '公开频道，不设私聊' },

    ];

    return '' +
      '<section class="v2-hero">' +
        '<div class="v2-eyebrow">ZICORA COMMUNITY</div>' +
        '<h1 class="v2-title">只此一心，<br>此刻同频。</h1>' +

      '<div class="v2-entries">' + entries.map((e) =>
        '<div class="v2-entry" data-go="#/' + e.r + '"><div class="l"><div class="v2-entry-t">' + e.t + '</div>' +

      '<section class="sec">' +

          '<span class="link-more" data-go="#/repo">去夸夸墙 →</span></div>' +
        (wall.length ? wall.map(praiseCard).join('')
          : '<div class="blank"><div class="b-line"></div><p>还没有人写第一条。引用一份资源，说说它好在哪。</p>' +
            '<button class="btn btn--sm btn--ghost" data-praise-new="1">写一条夸夸</button></div>') +

  function resCard(r) {
    const t = tone(r);

  /* ============================================================
     数据访问
     ============================================================ */
  async function loadDownloads(r) {
    const rows = await SB.http('/rest/v1/downloads?select=user_id,created_at&resource_id=eq.' + dbId(r) + '&order=created_at.desc&limit=50');
    return Array.isArray(rows) ? rows : [];
  }
  const dbId = (r) => (r._db || String(r.id).replace(/^r/, ''));

  async function recordDownload(r) {
    const m = me();
    try {
      await SB.http('/rest/v1/downloads', { method: 'POST', headers: { Prefer: 'resolution=merge-duplicates' }, body: [{ resource_id: Number(dbId(r)), user_id: m.id }] });
    } catch (e) {}
    try {
      await SB.http('/rest/v1/resources?id=eq.' + dbId(r), { method: 'PATCH', body: { downloads: (r.downloads || 0) + 1 } });
    } catch (e) {}
    r.downloads = (r.downloads || 0) + 1;
  }

  async function isRevoked(r) {
    const m = me();
    try {
      const rows = await SB.http('/rest/v1/revokes?select=user_id&resource_id=eq.' + dbId(r) + '&user_id=eq.' + m.id);
      return Array.isArray(rows) && rows.length > 0;
    } catch (e) { return false; }
  }

  async function like(r) {
    const m = me();
    if (!m) return toast('请先登录');
    if (liked(r)) return toast('已经赞过了');
    try { await SB.http('/rest/v1/resource_likes', { method: 'POST', body: [{ user_id: m.id, resource_id: Number(dbId(r)) }] }); } catch (e) { return toast(e.message || '点赞失败'); }
    r.likedBy = (r.likedBy || []).concat([m.id]);
    r.likes = (r.likes || 0) + 1;
    toast('已点赞');
    rerender();
  }

  /* ---------- 下载（带专属标记） ---------- */
  function stampText(m) {
    return 'ZICORA · 仅供 ' + m.name + '（ID ' + String(m.id).slice(0, 6).toUpperCase() + '）自用 · ' + dstr(new Date().toISOString()) + ' · 请勿转传';
  }

  async function grab(r) {
    const m = me();
    if (!m) return toast('请先登录');
    if (await isRevoked(r)) return toast('作者已收回你对这份资源的使用权');
    const need = needList(r);
    if (need.length) { toast('先点个赞、留一句夸夸，才能下载'); return; }
    const f = filesOf(r)[0];
    await recordDownload(r);
    if (!f || !f.u) {
      if (r.external) { window.open(r.external, '_blank', 'noopener'); toast('正在打开下载页'); }
      else toast('这份资源还没有上传文件，先联系作者补一下');
      return;
    }
    const isImg = /\.(png|jpg|jpeg|webp|gif)$/i.test(f.u) || /\.(png|jpg|jpeg|webp|gif)$/i.test(f.n);
    if (!isImg) {
      window.open(f.u, '_blank', 'noopener');
      toast('开始下载 · 已记录你的账号，转传会被作者看到');
      return;
    }
    try {
      const blob = await (await fetch(f.u, { mode: 'cors' })).blob();
      const bmp = await new Promise((res, rej) => {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => res(img);
        img.onerror = rej;
        img.src = URL.createObjectURL(blob);
      });
      const c = document.createElement('canvas');
      c.width = bmp.width; c.height = bmp.height;
      const ctx = c.getContext('2d');
      ctx.drawImage(bmp, 0, 0);
      const fs = Math.max(12, Math.round(c.width / 52));
      ctx.font = fs + 'px sans-serif';
      const txt = stampText(m);
      const tw = ctx.measureText(txt).width;
      ctx.fillStyle = 'rgba(0,0,0,.55)';
      ctx.fillRect(0, c.height - fs * 2.2, Math.min(c.width, tw + fs * 2), fs * 2.2);
      ctx.fillStyle = '#fff';
      ctx.fillText(txt, fs, c.height - fs * 0.7);
      const out = await new Promise((res) => c.toBlob(res, 'image/png'));
      const a = document.createElement('a');
      a.href = URL.createObjectURL(out);
      a.download = (f.n || 'zicora').replace(/\.(jpg|jpeg|webp|png)$/i, '') + '_' + String(m.id).slice(0, 6) + '.png';
      a.click();
      toast('已下载 · 图片右下角是你的专属标记');
    } catch (e) {
      window.open(f.u, '_blank', 'noopener');
      toast('已打开原文件（这份格式没法加标记，但下载已记录在你名下）');
    }
  }

  async function sha256(file) {
    try {
      const buf = await file.arrayBuffer();
      const h = await crypto.subtle.digest('SHA-256', buf);
      return Array.from(new Uint8Array(h)).map((b) => b.toString(16).padStart(2, '0')).join('');
    } catch (e) { return ''; }
  }

    try {
      const rows = await SB.http('/rest/v1/resources?select=id,cover,need_like,need_comment,hash');
      if (Array.isArray(rows)) {
        rows.forEach((x) => {
          const r = Store.data.resources.filter((y) => String(y._db) === String(x.id))[0];
          if (!r) return;
          r.cover = x.cover || '';
          r.needLike = !!x.need_like;
          r.needComment = !!x.need_comment;
          r.hash = x.hash || '';
        });
      }
    } catch (e) {} finally { enriching = false; }
  }
  window.ZV2.enrich = enrich;

  /* ============================================================
     统一拦截点击（捕获阶段，先于 70_app 的 bind 生效）
     ============================================================ */
  document.addEventListener('click', function (ev) {
    const el = ev.target && ev.target.closest ? ev.target.closest('div,button,a,label') : null;
    if (!el) return;
    const resOf = (target) => {
      const n = target.closest('[data-res]');
      return n ? Store.data.resources.filter((r) => r.id === n.getAttribute('data-res'))[0] : null;
    };

    const up = ev.target.closest('[data-upload]');
    if (up) { ev.preventDefault(); ev.stopPropagation(); openUpload2(); return; }

    const pn = ev.target.closest('[data-praise-new]');
    if (pn) { ev.preventDefault(); ev.stopPropagation(); praiseModal2(); return; }

    const rs = ev.target.closest('[data-res]');
    if (rs && !ev.target.closest('[data-like],[data-grab],[data-quote],[data-adel]')) {
      ev.preventDefault(); ev.stopPropagation();
      ZV.openResource(rs.getAttribute('data-res')); return;
    }

    const lk = ev.target.closest('[data-like]');
    if (lk) {
      ev.preventDefault(); ev.stopPropagation();
      const r = Store.data.resources.filter((x) => x.id === lk.getAttribute('data-like'))[0];
      if (r) { like(r); closeModal(); ZV.openResource(r.id); }
      return;
    }

    const qq = ev.target.closest('[data-quote]');
    if (qq) { ev.preventDefault(); ev.stopPropagation(); closeModal(); praiseModal2(qq.getAttribute('data-quote')); return; }

    const gb = ev.target.closest('[data-grab]');
    if (gb) {
      ev.preventDefault(); ev.stopPropagation();
      const r = Store.data.resources.filter((x) => x.id === gb.getAttribute('data-grab'))[0];
      if (r) grab(r);
      return;
    }

    const rv = ev.target.closest('[data-revoke]');
    if (rv) {
      ev.preventDefault(); ev.stopPropagation();
      const rid = rv.getAttribute('data-revoke'), uidv = rv.getAttribute('data-uid');
      SB.http('/rest/v1/revokes', { method: 'POST', body: [{ resource_id: Number(rid.replace(/^r/, '')), user_id: uidv }] })
        .then(() => { toast('已收回，对方无法再下载这份资源'); rv.textContent = '已收回'; })
        .catch((e) => toast('操作失败：' + (e.message || '')));
      return;
    }

    const ad = ev.target.closest('[data-adel]');
    if (ad) {
      ev.preventDefault(); ev.stopPropagation();
      const r = Store.data.resources.filter((x) => x.id === ad.getAttribute('data-adel'))[0];
      if (!r) return;
      openModal({
        eyebrow: 'Delete', title: '删除这份资源？', sub: '《' + r.name + '》会从数据库移除，不可恢复。',
        body: '<p class="v2-desc">删除后所有下载记录一并失效。</p>',
        foot: '<button class="btn btn--ghost" data-close="1">取消</button><button class="btn btn--danger" id="delOk">删除</button>',
        onMount: (root) => {
          root.querySelector('#delOk').addEventListener('click', async () => {
            try { await SB.http('/rest/v1/resources?id=eq.' + dbId(r), { method: 'DELETE' }); } catch (e) { return toast('删除失败：' + (e.message || '')); }
            Store.remove('resources', r.id); closeModal(); toast('已删除'); rerender();
          });
        }
      });
      return;
    }

    const pl = ev.target.closest('[data-plike]');
    if (pl) { ev.preventDefault(); ev.stopPropagation(); toast('已记下这次喜欢'); return; }

    const sn = ev.target.closest('[data-sort]');
    if (sn) { ev.preventDefault(); ev.stopPropagation(); lib.sort = sn.getAttribute('data-sort'); rerender(); return; }

    const gt = ev.target.closest('[data-go]');
    if (gt) { ev.preventDefault(); ev.stopPropagation(); location.hash = gt.getAttribute('data-go'); return; }
  }, true);

  /* 资源库搜索框（输入即筛） */
  document.addEventListener('input', function (ev) {
    if (ev.target && ev.target.id === 'v2q') {
      lib.q = ev.target.value.trim();
      const v = ev.target.value;
      const list = document.querySelector('.v2-grid');
      if (list) {
        const q = lib.q.toLowerCase();
        Array.from(document.querySelectorAll('.v2-grid-item')).forEach((n) => {
          const r = Store.data.resources.filter((x) => x.id === n.getAttribute('data-res'))[0];
          const t = ((r.name || '') + (r.desc || '') + ((Store.user(r.authorId) || { name: '' }).name || '')).toLowerCase();
          n.style.display = !q || t.indexOf(q) > -1 ? '' : 'none';
        });
      }
      if (document.activeElement !== ev.target) ev.target.value = v;
    }
  }, true);
})();




</script>
</body>
</html>
